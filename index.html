let invMoreOpen = false;
let invMoreHtml = '';

setInterval(() => invPoll(false), 15000);
invPoll(true);

// ===== History log (Δ, balancer, current, cells) persisted in localStorage =====
const HIST_KEY = 'bms_studio_hist_v1';
const HIST_MAX = 4000;       // ~6-10 hours of active 5s logging
let histStore = {};
try { histStore = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) { histStore = {}; }

function histKey(s) { return s.brand + '|' + (s.name || ''); }

function recordHistory() {
  const now = Date.now();
  let changed = false;
  for (const s of Object.values(sessions)) {
    if (!s.connected || !s.data || !s.data.cells || s.data.cells.length === 0) continue;
    const k = histKey(s);
    const arr = histStore[k] || (histStore[k] = []);
    const cur = s.data.current || 0;

    // Fast sampling: every 5s during active discharge (cur < -0.2A) or charge (cur > 0.2A)
    // Slower sampling: every 20s when idle
    const isUnderLoad = Math.abs(cur) >= 0.2;
    const reqInterval = isUnderLoad ? 5000 : 20000;
    if (arr.length && now - arr[arr.length - 1][0] < reqInterval - 600) continue;

    const c = s.data.cells;
    const minVal = Math.min(...c);
    const maxVal = Math.max(...c);
    const minIdx = c.indexOf(minVal);
    const maxIdx = c.indexOf(maxVal);
    const delta = Math.round((maxVal - minVal) * 1000);
    const cellsCopy = c.map(v => +v.toFixed(3));

    // Format: [ts, V, I, delta_mV, balActive, maxV, minV, minCellNum(1-based), maxCellNum(1-based), cellsCopy]
    arr.push([
      now,
      +(s.data.voltage || 0).toFixed(2),
      +cur.toFixed(2),
      delta,
      s.data.balMask ? 1 : 0,
      +maxVal.toFixed(3),
      +minVal.toFixed(3),
      minIdx + 1,
      maxIdx + 1,
      cellsCopy
    ]);
    if (arr.length > HIST_MAX) arr.splice(0, arr.length - HIST_MAX);
    changed = true;
  }
  if (changed) {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(histStore)); } catch (e) {}
  }
}
setInterval(recordHistory, 2500);

function fmtClock(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function renderHistoryPanel(s) {
  const arr = histStore[histKey(s)] || [];
  if (arr.length < 2) {
    return `<div class="cells-panel"><div class="cells-title">📈 Журнал Δ та аналіз комірок</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">Запис: кожні 5 с під навантаженням (20 с у спокої), поки Bluefy відкрито.</div></div>`;
  }
  const W = 300, H = 64;
  const t0 = arr[0][0], t1 = arr[arr.length - 1][0];
  const span = Math.max(1, t1 - t0);
  const maxD = Math.max(40, ...arr.map(r => r[3]));
  const x = r => ((r[0] - t0) / span * W).toFixed(1);
  const y = r => (H - 4 - (r[3] / maxD) * (H - 8)).toFixed(1);
  const pts = arr.map(r => `${x(r)},${y(r)}`).join(' ');

  // balancer ON bands
  let bands = '';
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i][4]) {
      const bx = x(arr[i]);
      const bw = Math.max(1, (x(arr[i + 1]) - bx)).toFixed(1);
      bands += `<rect x="${bx}" y="0" width="${bw}" height="${H}" fill="rgba(6,182,212,0.28)"/>`;
    }
  }
  const balMs = arr.reduce((a, r, i) => a + (i < arr.length - 1 && r[4] ? arr[i + 1][0] - r[0] : 0), 0);
  const minD = Math.min(...arr.map(r => r[3]));
  const last = arr[arr.length - 1];
  const peakCell = Math.max(...arr.map(r => r[5]));
  const lowestCell = Math.min(...arr.map(r => r[6]));
  const chgMax = Math.max(...arr.map(r => r[2]));
  const dsgMax = Math.min(...arr.map(r => r[2]));

  const lastMinCellNum = last[7] ? `Комірка #${last[7]}` : 'мін';
  const lastMaxCellNum = last[8] ? `Комірка #${last[8]}` : 'макс';

  return `
    <div class="cells-panel">
      <div class="cells-header">
        <span class="cells-title">📈 Журнал Δ • ${fmtClock(t0)}–${fmtClock(t1)}</span>
        <span class="delta-badge ${last[3] <= 30 ? 'good' : (last[3] <= 80 ? 'mid' : 'high')}">зараз ${last[3]} mV</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:64px;display:block;background:rgba(255,255,255,0.03);border-radius:10px;">
        ${bands}
        <polyline points="${pts}" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;gap:6px;flex-wrap:wrap;">
        <span>Δ мін: <b style="color:#e2e8f0">${minD}</b> • макс: <b style="color:#e2e8f0">${maxD}</b> mV</span>
        <span>⚖️ Баланс: <b style="color:#22d3ee">${Math.round(balMs / 60000)} хв</b></span>
        <span>Мінімум: <b style="color:#fca5a5">${lowestCell.toFixed(3)} V</b></span>
        <span>Пік: <b style="color:#34d399">${peakCell.toFixed(3)} V</b></span>
      </div>
      <div style="font-size:10.5px;color:#cbd5e1;margin-top:4px;">
        <span>Зараз внизу: <b style="color:#fca5a5">${lastMinCellNum}</b> (${last[6].toFixed(3)} V) • вгорі: <b style="color:#34d399">${lastMaxCellNum}</b> (${last[5].toFixed(3)} V)</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="icon-btn" style="width:auto;padding:0 10px;font-size:11px;" onclick="copyHistory('${s.id}')">📋 Копіювати CSV (${arr.length})</button>
        <button class="icon-btn" style="width:auto;padding:0 10px;font-size:11px;" onclick="clearHistory('${s.id}')">🗑 Очистити</button>
      </div>
    </div>`;
}

function copyHistory(id) {
  const s = sessions[id];
  if (!s) return;
  const arr = histStore[histKey(s)] || [];
  const maxCells = arr.reduce((m, r) => Math.max(m, (r[9] && r[9].length) || 0), 4);
  const cellHeaders = Array.from({length: maxCells}, (_, i) => `c${i+1}`).join(',');
  const header = `time,V,I,delta_mV,balancing,maxCell,minCell,minCellNum,maxCellNum,${cellHeaders}\n`;
  const rows = arr.map(r => {
    const cellsPart = (r[9] && r[9].length)
      ? r[9].join(',')
      : (r[6] !== undefined && r[5] !== undefined ? `${r[6]},${r[5]}` : '');
    return [
      new Date(r[0]).toISOString(),
      r[1],
      r[2],
      r[3],
      r[4],
      r[5],
      r[6],
      r[7] || '',
      r[8] || '',
      cellsPart
    ].join(',');
  }).join('\n');
  const csv = header + rows;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(csv).then(() => alert('Скопійовано ' + arr.length + ' рядків CSV з напругами всіх комірок'),
      () => prompt('Скопіюйте вручну:', csv.slice(-4000)));
  } else {
    prompt('Скопіюйте вручну:', csv.slice(-4000));
  }
}

function clearHistory(id) {
  const s = sessions[id];
  if (!s) return;
  if (!confirm('Очистити журнал?')) return;
  delete histStore[histKey(s)];
  try { localStorage.setItem(HIST_KEY, JSON.stringify(histStore)); } catch (e) {}
  renderCards();
}

function getRoleBadge(s, slots) {
  if (s.brand === 'Sandisolar') {
    return { cls: '', text: '🔗 Гілка А (24V) • Послідовно 1/2 з SJY + Балансир' };
  }
  if (s.brand === 'SJY') {
    return { cls: '', text: '🔗 Гілка А (24V) • Послідовно 2/2 з Sandisolar + Балансир' };
  }
  if (s.brand === 'Humsienk') {
    if (slots.hs1 && slots.hs2) {
      const idx = (slots.hs1.id === s.id) ? '1/2' : '2/2';
      return { cls: '', text: `🔗 Гілка Б (24V) • Humsienk Послідовно ${idx} (В паралелі)` };
    }
    return { cls: 'role-b', text: '⏳ Гілка Б • Humsienk #1 (Поки стоїть окремо — чекає пару до 24V)' };
  }
  return { cls: '', text: '🔋 Додатковий акумулятор' };
}

function renderCards() {
  const container = document.getElementById('cards');
  const list = Object.values(sessions);
  const slots = getTopologySlots(list);
  updateTopHighlights(list);

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔋</div>
        <div style="font-weight:700; color:#e2e8f0; margin-bottom:4px;">Немає підключених акумуляторів</div>
        <div>Натисніть на кнопку потрібного акумулятора зверху, щоб зчитати комірки та BMS</div>
      </div>
    ` + renderBleLog();
    return;
  }

  container.innerHTML = list.map(s => {
    const d = s.data || {};
    const cells = d.cells || [];
    let minV = null, maxV = null, deltaMv = null, minIdx = -1, maxIdx = -1;

    if (cells.length > 0) {
      minV = Math.min(...cells);
      maxV = Math.max(...cells);
      deltaMv = Math.round((maxV - minV) * 1000);
      minIdx = cells.indexOf(minV);
      maxIdx = cells.indexOf(maxV);
    }

    const soc = d.soc !== undefined ? d.soc : 0;
    const cur = d.current || 0;
    const isCharging = cur > 0.05;
    const isDischarging = cur < -0.05;

    const socClass = [
      soc < 20 ? 'low' : (soc < 45 ? 'warn' : ''),
      isCharging ? 'charging' : ''
    ].filter(Boolean).join(' ');

    const flowCls = isCharging ? 'charging' : (isDischarging ? 'discharging' : '');
    const flowText = isCharging ? '⚡ Заряджається' : (isDischarging ? '🔋 Розряд' : 'Спокій');

    const balActive = Boolean(d.balMask && d.balMask > 0);
    const deltaClass = deltaMv === null ? 'good' : (deltaMv <= 20 ? 'good' : (deltaMv <= 60 ? 'mid' : 'high'));

    const updatedStr = s.lastUpdate instanceof Date
      ? s.lastUpdate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : (s.lastUpdate || 'підключення...');

    const shortId = (s.name && s.name.length >= 4)
      ? '#' + s.name.replace(/[^A-Za-z0-9]/g, '').slice(-4)
      : '';

    const role = getRoleBadge(s, slots);
    const dotCls = s.connected ? '' : (s.reconnecting ? 'connecting' : 'off');

    const cellsHtml = cells.map((cv, idx) => {
      const isBal = Boolean(d.balMask && (d.balMask & (1 << idx)));
      const isMin = !isBal && idx === minIdx && deltaMv > 2;
      const isMax = !isBal && idx === maxIdx && deltaMv > 2;
      const itemCls = isBal ? 'is-bal' : (isMin ? 'is-min' : (isMax ? 'is-max' : ''));
      const tagHtml = isBal
        ? `<span class="cell-tag bal">⚖️ BAL</span>`
        : (isMin ? `<span class="cell-tag min">MIN</span>` : (isMax ? `<span class="cell-tag max">MAX</span>` : ''));

      const pct = Math.max(6, Math.min(100, ((cv - 3.0) / 0.65) * 100));

      return `
        <div class="cell-item ${itemCls}">
          <div class="cell-top">
            <span class="cell-idx">Комірка #${idx + 1}</span>
            ${tagHtml}
          </div>
          <div class="cell-volt">${cv.toFixed(3)} V</div>
          <div class="cell-bar">
            <div class="cell-bar-fill" style="width:${pct}%"></div>
          </div>
        </div>
      `;
    }).join('');

    const tempStr = (d.temps && d.temps.length > 0) ? `${d.temps[0]}°C` : '—';
    const etaStr = formatEta(d);

    return `
      <div id="card-${s.id}" class="card">
        <div class="card-role-bar ${role.cls}">${role.text}</div>

        <div class="card-top">
          <div>
            <div class="brand-title">
              <span class="dot ${dotCls}"></span>
              <span>${s.brand}</span>
              ${shortId ? `<span class="short-id">${shortId}</span>` : ''}
            </div>
            <div class="dev-sub">${s.name} • ${s.connected ? 'оновлено о ' + updatedStr : 'не підключено'}</div>
          </div>
          <div class="card-actions">
            ${!s.connected
              ? `<button class="icon-btn" onclick="manualReconnect('${s.id}', true)" title="Підключити">↻</button>`
              : `<button class="icon-btn" onclick="pollSession(sessions['${s.id}'], true)" title="Оновити">↻</button>`
            }
            <button class="icon-btn" onclick="disconnectDevice('${s.id}')" title="Видалити">✕</button>
          </div>
        </div>

        ${!s.connected ? `
          <div class="reconnect-banner" onclick="manualReconnect('${s.id}', true)">
            <span>🔴 Bluetooth не підключено</span>
            <span>⚡ Натисніть, щоб підключити →</span>
          </div>
        ` : ''}

        <div class="soc-panel">
          <div class="soc-header">
            <div class="soc-left">
              <div class="soc-val">${d.soc !== undefined ? d.soc + '%' : '—'}</div>
              <span class="flow-pill ${flowCls}">${flowText}</span>
            </div>
            <div class="soc-right">
              <div class="soc-cap">${fmt(d.remCap, 1)} / ${fmt(d.nomCap, 0)} Ah</div>
              <div class="soc-eta">${etaStr}</div>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill ${socClass}" style="width:${Math.min(100, Math.max(0, soc))}%"></div>
          </div>
        </div>

        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-label">Напруга</div>
            <div class="metric-num">${fmt(d.voltage, 2)} <span class="unit">V</span></div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Струм</div>
            <div class="metric-num">${fmt(d.current, 2)} <span class="unit">A</span></div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Потужність</div>
            <div class="metric-num">${fmt(d.power, 0)} <span class="unit">W</span></div>
          </div>
        </div>

        <div class="switches-grid">
          <div class="switch-pill ${balActive ? 'bal-on' : ''}">
            <span>⚖️ Баланс</span>
            <span class="state">${balActive ? 'ON' : 'OFF'}</span>
          </div>
          <div class="switch-pill ${d.chgMos ? 'on' : 'off'}">
            <span>⚡ Заряд</span>
            <span class="state">${d.chgMos === undefined ? '—' : (d.chgMos ? 'ON' : 'OFF')}</span>
          </div>
          <div class="switch-pill ${d.dsgMos ? 'on' : 'off'}">
            <span>🔋 Розряд</span>
            <span class="state">${d.dsgMos === undefined ? '—' : (d.dsgMos ? 'ON' : 'OFF')}</span>
          </div>
        </div>

        ${cells.length > 0 ? `
          <div class="cells-panel">
            <div class="cells-header">
              <span class="cells-title">Комірки (${cells.length}S) • ${minV.toFixed(3)}–${maxV.toFixed(3)}V</span>
              <span class="delta-badge ${deltaClass}">Δ ${deltaMv} mV</span>
            </div>
            <div class="cells-grid">
              ${cellsHtml}
            </div>
          </div>
        ` : ''}

        ${cells.length > 0 ? renderHistoryPanel(s) : ''}

        <div class="card-footer">
          <span class="footer-chip">🔄 Цикли: <b>${d.cycles !== undefined ? d.cycles : '—'}</b></span>
          <span class="footer-chip">🌡 Темп: <b>${tempStr}</b></span>
          ${d.soh ? `<span class="footer-chip">💚 SOH: <b>${d.soh}%</b></span>` : ''}
        </div>
      </div>
    `;
  }).join('') + renderBleLog();
}

// Initialize on load: restore cached devices & auto-connect via navigator.bluetooth.getDevices()
restoreCachedSessions();
renderCards();
window.addEventListener('load', () => {
  tryAutoConnectRemembered(false);
});
</script>
</body>
</html>
