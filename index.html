// =====================================================================================
// HISTORY TAB: boiler, outages, statistics, charge diary, confirmed capacity.
// Everything here lives on its own tab and never touches the main screen.
// =====================================================================================
const HX_KEY = 'bms_studio_hx_v1';          // inverter day rows cache: { days: { 'YYYY-MM-DD': { rows, done } } }
const HX_DIARY_KEY = 'bms_studio_diary_v1'; // charge diary: { 'brand|name': [episode, ...] }
const HX_BOILER_KEY = 'bms_studio_boiler_v1';
const HX_DAYS = 7;
let hx = { days: {} };
try { hx = JSON.parse(localStorage.getItem(HX_KEY) || 'null') || { days: {} }; } catch (e) { hx = { days: {} }; }
let hxDiary = {};
try { hxDiary = JSON.parse(localStorage.getItem(HX_DIARY_KEY) || '{}') || {}; } catch (e) { hxDiary = {}; }
const hxState = { busy: false, error: null, lastFetch: 0, boiler: null, boilerErr: null, boilerAt: 0, boilerBusy: false };

const hxDayStr = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const hxHm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const hxDm = t => { const d = new Date(t); return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`; };

// ---- inverter history (cloud) ----
async function hxFetchDay(day) {
  const rows = [];
  for (let page = 0; page < 8; page++) {
    let dat;
    try { dat = await invCall(`&action=queryDeviceDataOneDayPaging&date=${day}&page=${page}&pagesize=100` + invDevQuery()); }
    catch (e) { if (page === 0 && /Немає даних|NO_RECORD/i.test(e.message || '')) return []; throw e; }
    const titles = ((dat && dat.title) || []).map(x => invKey(x.title));
    const list = (dat && dat.row) || [];
    if (!list.length) break;
    const ix = n => titles.indexOf(n);
    const iT = ix('timestamp'), iM = ix('operating mode'), iG = ix('grid voltage'), iP = ix('battery power'),
          iI = ix('battery current'), iV = ix('battery voltage'), iO = ix('total output active power');
    if (iT < 0 || iM < 0) break;
    for (const r of list) {
      const f = r.field || [];
      const ts = new Date(String(f[iT]).replace(' ', 'T')).getTime();
      if (!ts) continue;
      const gridV = parseFloat(f[iG]);
      const off = /battery|off-?grid|inverter/i.test(f[iM] || '') || (!isNaN(gridV) && gridV < 150) ? 1 : 0;
      rows.push([ts, off, parseFloat(f[iP]) || 0, parseFloat(f[iI]) || 0, parseFloat(f[iV]) || 0, parseFloat(f[iO]) || 0]);
    }
    if (list.length < 100) break;
  }
  rows.sort((a, b) => a[0] - b[0]);
  return rows;
}

async function hxRefresh(force = false) {
  if (!inv.cfg || !inv.cfg.dev || hxState.busy) return;
  if (!force && Date.now() - hxState.lastFetch < 5 * 60000) return;
  hxState.busy = true; hxState.error = null;
  if (activeTab === 'history') renderHistoryTab();
  try {
    const today = hxDayStr(Date.now());
    for (let i = HX_DAYS - 1; i >= 0; i--) {
      const day = hxDayStr(Date.now() - i * 86400000);
      const c = hx.days[day];
      if (c && c.done && day !== today) continue;          // past days never change
      hx.days[day] = { rows: await hxFetchDay(day), done: day !== today };
    }
    const keep = new Set(Array.from({ length: HX_DAYS + 1 }, (_, i) => hxDayStr(Date.now() - i * 86400000)));
    for (const k of Object.keys(hx.days)) if (!keep.has(k)) delete hx.days[k];
    hxState.lastFetch = Date.now();
    try { localStorage.setItem(HX_KEY, JSON.stringify(hx)); } catch (e) {}
  } catch (e) {
    hxState.error = invErrUa(e.message || String(e));
  } finally {
    hxState.busy = false;
    if (activeTab === 'history') renderHistoryTab();
  }
}

// rows: [ts, off, batP(W, − discharge), batI(A), batV, outW]
function hxAnalyze() {
  const rows = Object.keys(hx.days).sort().flatMap(d => hx.days[d].rows || []);
  const CAP = 15 * 60000;                                   // a longer hole = logger was offline, don't integrate over it
  // The inverter under-reads battery current. Checked against both BMS on 12.11: on charge it shows 30.8 A
  // where the BMS see 31.5–32.5 A (~4% low); on discharge it also rounds to 1.4 A steps, and a day's discharge
  // came out ~15% below what the BMS counted. Outage energy, average draw and capacity are all scaled.
  const K_DIS = 1.15, K_CHG = 1.04;
  const outages = [];
  let cur = null, chargedWh = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], prev = rows[i - 1];
    const dtH = prev ? Math.min(r[0] - prev[0], CAP) / 3600000 : 0;
    if (prev && cur) {                                      // interval prev -> r belongs to the outage
      cur.wh += Math.abs(Math.min(0, prev[2])) * dtH * K_DIS;
      cur.ah += Math.abs(Math.min(0, prev[3])) * dtH * K_DIS;
    } else if (prev && prev[2] > 0 && !prev[1]) {
      chargedWh += prev[2] * dtH;
    }
    if (r[1] && !cur) {
      cur = { t0: r[0], t1: r[0], wh: 0, ah: 0, minV: r[4] || 99, peakW: 0,
              fromFull: Boolean(prev && !prev[1] && prev[4] >= 27.0 && Math.abs(prev[3]) < 2), chargedBefore: chargedWh };
    }
    if (cur) {
      if (r[1]) { cur.t1 = r[0]; if (r[4]) cur.minV = Math.min(cur.minV, r[4]); cur.peakW = Math.max(cur.peakW, Math.abs(r[2])); }
      else { cur.t1 = r[0]; outages.push(cur); cur = null; }
    }
  }
  if (cur) { cur.ongoing = Date.now() - cur.t1 < 20 * 60000; outages.push(cur); }
  for (const o of outages) { o.hours = (o.t1 - o.t0) / 3600000; o.avgW = o.hours > 0.05 ? o.wh / o.hours : 0; }

  const win = from => {
    const list = outages.filter(o => o.t1 > from);
    const hours = list.reduce((a, o) => a + (o.t1 - Math.max(o.t0, from)) / 3600000, 0);
    const wh = list.reduce((a, o) => a + o.wh * (o.hours > 0 ? (o.t1 - Math.max(o.t0, from)) / (o.t1 - o.t0 || 1) : 0), 0);
    const ah = list.reduce((a, o) => a + o.ah * (o.hours > 0 ? (o.t1 - Math.max(o.t0, from)) / (o.t1 - o.t0 || 1) : 0), 0);
    let chg = 0;
    for (let i = 1; i < rows.length; i++) {
      const p = rows[i - 1];
      if (p[0] >= from && p[2] > 0 && !p[1]) chg += p[2] * Math.min(rows[i][0] - p[0], CAP) / 3600000;
    }
    return { n: list.length, hours, wh, ah, chg };
  };
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const today = win(midnight.getTime());
  const week = win(Date.now() - HX_DAYS * 86400000);
  // A deep discharge often spans several outages with short grid bursts between them ("light for 5 min"): the battery
  // gets a few Ah back but never reaches full. Chain them from a full start; net Ah = taken out − put back in between.
  const runs = [];
  let run = null;
  for (const o of outages) {
    if (o.fromFull) { if (run) runs.push(run); run = { t0: o.t0, t1: o.t1, ah: o.ah, minV: o.minV, n: 1 }; continue; }
    if (!run) continue;
    let back = 0, hole = false;
    for (let i = 1; i < rows.length; i++) {
      const p = rows[i - 1];
      if (p[0] < run.t1 || p[0] >= o.t0) continue;
      if (rows[i][0] - p[0] > CAP) hole = true;           // logger offline in between: can't tell what happened
      if (!p[1] && p[3] > 0) back += p[3] * Math.min(rows[i][0] - p[0], CAP) / 3600000;
    }
    if (hole) { runs.push(run); run = null; continue; }
    run.ah += o.ah - back * K_CHG; run.t1 = o.t1; run.minV = Math.min(run.minV, o.minV); run.n++;
  }
  if (run) runs.push(run);
  const deepest = runs.filter(r => r.ah > 1).sort((a, b) => b.ah - a.ah)[0] || null;
  return { outages, today, week, deepest, first: rows.length ? rows[0][0] : null,
           avgW: week.hours >= 2 ? week.wh / week.hours : null };
}

// Typical battery-side draw during outages, learned from the last week (used by the "if the grid drops" estimate)
let hxTypCache = { t: 0, v: null };
function hxTypicalW() {
  if (Date.now() - hxTypCache.t < 60000) return hxTypCache.v;
  let v = null;
  try { const a = hxAnalyze(); v = a.avgW && a.avgW > 30 ? Math.round(a.avgW) : null; } catch (e) {}
  hxTypCache = { t: Date.now(), v };
  return v;
}

// ---- charge diary (from the BLE journal, only while the page is open) ----
function hxUpdateDiary() {
  let changed = false;
  for (const [key, arr] of Object.entries(histStore)) {
    if (!arr || arr.length < 10) continue;
    const eps = [];
    let ep = null, lastChg = 0;
    const close = () => { if (ep) { eps.push(ep); ep = null; } };
    for (let i = 0; i < arr.length; i++) {
      const r = arr[i], prev = arr[i - 1];
      const gap = prev ? r[0] - prev[0] : 0;
      if (ep && (gap > 15 * 60000 || r[2] < -0.5 || r[0] - lastChg > 30 * 60000)) close();
      if (r[2] > 0.3) {
        if (!ep) ep = { t0: r[0], t1: r[0], peak: 0, cell: 0, dEnd: r[3], dMax: 0, bal: 0, maxI: 0 };
        lastChg = r[0]; ep.t1 = r[0];
        if (r[5] > ep.peak) { ep.peak = r[5]; ep.cell = r[8]; }
        ep.dMax = Math.max(ep.dMax, r[3]); ep.maxI = Math.max(ep.maxI, r[2]);
        ep.dEnd = r[3];                                     // delta at the last moment current was still flowing
        ep.iEnd = r[2];
      }
      if (ep && prev && prev[4] && gap < 60000) ep.bal += gap;
    }
    const open = ep; close();
    const list = hxDiary[key] || (hxDiary[key] = []);
    for (const e of eps) {
      if (e.peak < 3.40 || e.t1 - e.t0 < 5 * 60000) continue;   // only charges that reached the top
      const rec = { t0: e.t0, t1: e.t1, peak: +e.peak.toFixed(3), cell: e.cell, dEnd: e.dEnd, dMax: e.dMax,
                    bal: Math.round(e.bal / 60000), maxI: +e.maxI.toFixed(1), iEnd: +(e.iEnd || 0).toFixed(1),
                    bulk: (inv.settings && invNum(inv.settings.bat_maximum_charging_voltage)) || null };
      // Same charge = overlapping time range. The journal is a ring buffer, so the start of a long charge
      // can scroll out of it: keep the earliest start and the best values seen so far.
      const old = list.find(x => e.t0 <= x.t1 + 10 * 60000 && e.t1 >= x.t0 - 10 * 60000);
      if (old) {
        if (old.t1 >= e.t1 && old.t0 <= e.t0) continue;      // nothing new
        const keepPeak = old.peak > rec.peak;
        Object.assign(old, rec, {
          t0: Math.min(old.t0, rec.t0), bulk: old.bulk || rec.bulk,
          peak: keepPeak ? old.peak : rec.peak, cell: keepPeak ? old.cell : rec.cell,
          dMax: Math.max(old.dMax, rec.dMax), bal: Math.max(old.bal, rec.bal), maxI: Math.max(old.maxI, rec.maxI)
        });
      } else list.push(rec);
      changed = true;
    }
    list.sort((a, b) => a.t0 - b.t0);
    if (list.length > 40) list.splice(0, list.length - 40);
  }
  if (changed) { try { localStorage.setItem(HX_DIARY_KEY, JSON.stringify(hxDiary)); } catch (e) {} }
}
setInterval(hxUpdateDiary, 60000);

// ---- boiler (Cloudflare Worker status) ----
function hxBoilerUrl() { try { return localStorage.getItem(HX_BOILER_KEY) || ''; } catch (e) { return ''; } }
function hxBoilerSave() {
  const v = (document.getElementById('hx-boiler-url').value || '').trim();
  if (v && !/^https:\/\/[a-z0-9.-]+\.workers\.dev\/\?k=[\w-]+$/i.test(v)) { hxState.boilerErr = 'Це не схоже на адресу статусу'; renderHistoryTab(); return; }
  try { v ? localStorage.setItem(HX_BOILER_KEY, v) : localStorage.removeItem(HX_BOILER_KEY); } catch (e) {}
  hxState.boiler = null; hxState.boilerErr = null; hxState.boilerAt = 0;
  renderHistoryTab(); hxBoilerPoll(true);
}
async function hxBoilerPoll(force = false) {
  const url = hxBoilerUrl();
  if (!url || hxState.boilerBusy) return;
  if (!force && Date.now() - hxState.boilerAt < 30000) return;
  hxState.boilerBusy = true;
  try {
    const r = await fetch(url + '&json=1&sock=1');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    hxState.boiler = await r.json(); hxState.boilerErr = null;
  } catch (e) { hxState.boilerErr = 'Немає звʼязку з автоматикою'; }
  hxState.boilerAt = Date.now(); hxState.boilerBusy = false;
  if (activeTab === 'history') renderHistoryTab();
}

// ---- rendering: three compact cards, no folds, no filler text ----
const hxKwh = wh => (wh / 1000).toFixed(2) + ' кВт·год';
const hxDur = h => formatHoursMinutes(h);
let hxAllOut = false;

function hxRenderBoiler() {
  const url = hxBoilerUrl();
  if (!url) {
    return `<div class="cells-panel hx-card">
      <div class="hx-line"><span class="hx-name">🚿 Бойлер</span><span class="hx-dim">вставте адресу з status_url.txt</span></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input id="hx-boiler-url" class="hx-input" placeholder="https://….workers.dev/?k=…" autocomplete="off" autocapitalize="off">
        <button class="icon-btn" style="width:auto;padding:0 12px;font-size:12px;" onclick="hxBoilerSave()">Зберегти</button>
      </div>${hxState.boilerErr ? `<div class="hx-warn">${hxState.boilerErr}</div>` : ''}</div>`;
  }
  const b = hxState.boiler;
  const reset = `<input id="hx-boiler-url" type="hidden" value=""><span class="link" onclick="hxBoilerSave()">змінити адресу</span>`;
  if (!b) {
    return `<div class="cells-panel hx-card"><div class="hx-line"><span class="hx-name">🚿 Бойлер</span>
      <span class="hx-dim">${hxState.boilerErr ? hxState.boilerErr : 'завантаження…'}</span></div>
      ${hxState.boilerErr ? `<div class="hx-warn">${reset}</div>` : ''}</div>`;
  }
  const st = b.st || {}, so = b.sock || {};
  const ageMin = st.lastRun ? Math.max(0, Math.floor(Date.now() / 60000) - st.lastRun) : null;
  let state, cls = 'off';
  if (so.error || so.on === null || so.on === undefined) { state = 'немає даних'; }
  else if (so.online === false) { state = 'Розетка не в мережі'; cls = 'bad'; }
  else if (so.on && so.powerW > 20) { state = `Гріє • ${Math.round(so.powerW)} W`; cls = 'heat'; }
  else if (so.on) { state = 'Увімкнений • не гріє'; cls = 'on'; }
  else if (st.want === 'grid' && st.applied === false && st.gridSince) {
    // the Worker waits for the grid to hold before heating (short "light for 5 min" bursts)
    const t = new Date(st.gridSince + 10 * 60e3);
    state = `Вимкнений • увімкну о ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  }
  else { state = st.want === 'grid' ? 'Вимкнений' : 'Вимкнений • без світла'; }
  // one red line only when something is wrong; silence means the automation is fine
  const problems = [];
  if (ageMin === null || ageMin > 3) problems.push(`Автоматика не відповідає${ageMin !== null ? ` ${ageMin} хв` : ''}`);
  if (st.sockErr) problems.push('Автоматика не може керувати розеткою');
  if (st.invErr) problems.push('Автоматика не бачить інвертор');
  return `<div class="cells-panel hx-card">
    <div class="hx-line"><span class="hx-name">🚿 Бойлер</span><span class="hx-state ${cls}">${state}</span></div>
    ${problems.length ? `<div class="hx-warn">⚠️ ${problems.join(' • ')} • ${reset}</div>` : ''}</div>`;
}

function hxRenderOutages(a) {
  const tile = (label, val, sub) => `<div class="flow-item"><div class="bus-label">${label}</div><div class="bus-val">${val}</div><div class="bus-sub">${sub}</div></div>`;
  const tiles = `<div class="flow-bar hx-tiles">
    ${tile('Сьогодні', a.today.n ? hxDur(a.today.hours) : 'не було', a.today.n ? hxKwh(a.today.wh) : 'відключень')}
    ${tile(HX_DAYS + ' днів', a.week.n ? hxDur(a.week.hours) : 'не було', a.week.n ? hxKwh(a.week.wh) : 'відключень')}
    ${tile('Середній розряд', a.avgW ? Math.round(a.avgW) + ' W' : '—', 'без світла • +15%')}
  </div>`;
  const all = a.outages.slice().reverse();
  const shown = hxAllOut ? all : all.slice(0, 5);
  let rows = shown.map(o => `<div class="hx-row">
      <span>${hxDm(o.t0)}</span><span>${hxHm(o.t0)}–${o.ongoing ? 'зараз' : hxHm(o.t1)}</span>
      <b>${hxDur(o.hours)}</b><b>${hxKwh(o.wh)}</b></div>`).join('');
  if (!all.length) rows = `<div class="hx-dim" style="padding:6px 0">${hxState.busy ? 'завантаження…' : 'Відключень не було'}</div>`;
  const more = all.length > 5 ? `<div class="hx-more" onclick="hxAllOut=!hxAllOut;renderHistoryTab()">${hxAllOut ? 'згорнути' : `ще ${all.length - 5}`}</div>` : '';
  const last = a.outages[a.outages.length - 1];
  return `<div class="cells-panel hx-card">
    <div class="hx-line"><span class="hx-name">🔌 Відключення</span>${last && last.ongoing ? '<span class="hx-state bad">зараз без світла</span>' : ''}</div>
    ${tiles}${rows}${more}
    ${hxState.error ? `<div class="hx-warn">⚠️ ${hxState.error}</div>` : ''}</div>`;
}

function hxRenderBattery(a) {
  const d = a ? a.deepest : null;
  const offV = etaParams().offV;
  const cap = d
    ? `<div class="hx-line hx-cap"><span>Перевірена ємність пари</span><b>${d.minV <= offV + 0.3 ? '≈' : 'не менше'} ${d.ah.toFixed(0)} Ah</b></div>
       <div class="hx-dim">розряд ${hxDm(d.t0)} від повної до ${d.minV.toFixed(1)} V${d.n > 1 ? ` • ${d.n} відключення поспіль, підзаряд між ними враховано` : ''} • з поправкою на інвертор (+15%, звірено з BMS)</div>`
    : `<div class="hx-line hx-cap"><span>Перевірена ємність пари</span><b>—</b></div>
       <div class="hx-dim">ще не було розряду від повної батареї</div>`;
  const keys = Object.keys(hxDiary).filter(k => (hxDiary[k] || []).length)
    .sort((x, y) => (x.startsWith('Sandisolar') ? 0 : 1) - (y.startsWith('Sandisolar') ? 0 : 1));
  let diary = `<div class="hx-dim" style="padding-top:6px">Заряди зʼявляться тут, коли сайт відкритий під час заряду.</div>`;
  if (keys.length) {
    diary = keys.map(k => {
      const list = hxDiary[k].slice(-5).reverse();
      return (keys.length > 1 ? `<div class="hx-sub">${k.split('|')[0]}</div>` : '') +
        `<div class="hx-row hx-chg hx-head"><span>Заряд</span><span>до</span><b>Пік</b><b>Δ в кінці</b><b>Баланс</b></div>` +
        list.map(e => `<div class="hx-row hx-chg">
          <span>${hxDm(e.t0)} ${hxHm(e.t0)}</span><span>${e.bulk ? e.bulk.toFixed(1) + ' V' : '—'}</span>
          <b class="${e.peak >= 3.58 ? 'hx-red' : ''}">#${e.cell} ${e.peak.toFixed(3)}</b><b>${e.dEnd} mV</b><b>${e.bal} хв</b></div>`).join('');
    }).join('');
  }
  return `<div class="cells-panel hx-card">
    <div class="hx-line"><span class="hx-name">🔋 Батарея</span></div>
    ${cap}<div class="hx-sep"></div>${diary}</div>`;
}

function renderHistoryTab() {
  const root = document.getElementById('history-panel');
  if (!root) return;
  hxUpdateDiary();
  let html = hxRenderBoiler();
  if (!inv.cfg || !inv.cfg.dev) {
    html += `<div class="cells-panel hx-card"><div class="hx-line"><span class="hx-name">🔌 Відключення</span>
      <span class="link" onclick="invOpenModal()">Увійти в SmartESS →</span></div></div>` + hxRenderBattery(null);
  } else {
    const a = hxAnalyze();
    html += hxRenderOutages(a) + hxRenderBattery(a);
  }
  const inp = document.getElementById('hx-boiler-url');
  const typed = inp && inp.type !== 'hidden' ? inp.value : '';
  const hadFocus = inp && document.activeElement === inp;
  root.innerHTML = html;
  uaUnits(root);
  const inp2 = document.getElementById('hx-boiler-url');
  if (typed && inp2 && inp2.type !== 'hidden') { inp2.value = typed; if (hadFocus) inp2.focus(); }
}

setInterval(() => {
  if (activeTab !== 'history' || document.hidden) return;
  hxBoilerPoll(); hxRefresh();
}, 15000);

// Initialize on load: restore cached devices & auto-connect via navigator.bluetooth.getDevices()
restoreCachedSessions();
renderCards();
window.addEventListener('load', () => {
  tryAutoConnectRemembered(false);
});
</script>
</body>
</html>
