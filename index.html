    .inv-kv .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--border); }
    .inv-kv .row:last-child { border-bottom:0; }
    .inv-kv .row span { color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .inv-kv .row b { text-align:right; font-variant-numeric:tabular-nums; }
    .inv-kv .row i { font-style:normal; color:var(--muted); font-weight:600; }
    .inv-note { font-size:11.5px; line-height:1.45; color:#fcd34d; padding:8px 0 4px; }
    .eta-sub { display:block; font-size:10.5px; font-weight:600; opacity:.75; margin-top:3px; line-height:1.35; }
    .inv-eta-banner { gap:10px; }
    .inv-eta-banner .inv-eta-val { white-space:nowrap; }
    .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
    .modal-back.show { display:flex; }
    .modal { width:100%; max-width:360px; background:#0d1424; border:1px solid var(--border-highlight); border-radius:20px; padding:18px; color:var(--text); }
    .modal h3 { margin:0 0 4px; font-size:16px; }
    .modal p { margin:0 0 8px; font-size:12px; color:var(--muted); line-height:1.45; }
    .modal label { display:block; font-size:11px; color:var(--muted); font-weight:700; margin:10px 0 4px; }
    .modal input { width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--border-highlight); background:var(--card-inner); color:var(--text); font-size:16px; }
    .modal details { margin-top:10px; font-size:12px; color:var(--muted); }
    .modal .btns { display:flex; gap:8px; margin-top:16px; }
    .modal button { flex:1; padding:11px; border-radius:12px; border:1px solid var(--border-highlight); background:var(--card-inner); color:var(--text); font-weight:800; font-size:14px; }
    .modal button.primary { background:var(--blue); border-color:var(--blue); }
    .modal .err { color:#fda4af; font-size:12px; margin-top:8px; min-height:16px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="title-wrap">
      <div class="app-icon">⚡</div>
      <div>
        <h1>BMS Studio</h1>
        <div class="header-sub" id="header-sub">Домашня система 24V</div>
      </div>
    </div>
    <div class="live-badge" onclick="tryAutoConnectRemembered(true)" title="Оновити / підключити збережені АКБ">
      <span class="pulse-dot"></span>
      <span id="live-status-text">НАЖИВО 2с</span>
    </div>
  </div>

  <!-- 2-Tab Switcher -->
  <div class="tabs-bar">
    <button id="tab-btn-visual" class="tab-btn active" onclick="switchTab('visual')">
      <span>🏠 Схема</span>
    </button>
    <button id="tab-btn-details" class="tab-btn" onclick="switchTab('details')">
      <span>📊 Деталі</span>
      <span id="tab-count-badge" class="tab-count">0</span>
    </button>
    <button id="tab-btn-history" class="tab-btn" onclick="switchTab('history')">
      <span>🕘 Історія</span>
    </button>
  </div>

  <!-- TAB 1: VISUAL SYSTEM OVERVIEW -->
  <div id="tab-visual" class="tab-pane active">
    <div id="topology-panel"></div>
  </div>

  <!-- TAB 2: DETAILED CARDS (CELLS, MOSFETS, CYCLES) -->
  <div id="tab-details" class="tab-pane">
    <div id="cards" class="cards"></div>
  </div>

  <!-- TAB 3: HISTORY (BOILER, OUTAGES, STATS, CHARGE DIARY, CAPACITY) -->
  <div id="tab-history" class="tab-pane">
    <div id="history-panel"></div>
  </div>
</div>

<div id="inv-modal" class="modal-back" onclick="if(event.target===this)invCloseModal()">
  <div class="modal">
    <h3>🔌 Інвертор через SmartESS</h3>
    <p>Логін від застосунку SmartESS. Дані йдуть напряму з хмари SmartESS, лише читання. Пароль не зберігається — тільки його хеш і токен на цьому пристрої.</p>
    <label>Логін SmartESS</label>
    <input id="inv-usr" autocomplete="username" autocapitalize="off" autocorrect="off">
    <label>Пароль</label>
    <input id="inv-pwd" type="password" autocomplete="current-password">
    <details>
      <summary>Додатково: кілька пристроїв в акаунті</summary>
      <label>PN логера або назва пристрою</label><input id="inv-pn" placeholder="I20000251235621334">
    </details>
    <div class="err" id="inv-err"></div>
    <div class="btns">
      <button onclick="invLogout()">Вийти</button>
      <button class="primary" id="inv-login-btn" onclick="invLoginFromForm()">Підключити</button>
    </div>
  </div>
</div>

<script>
const UUID_SVC_HL  = '0000fffa-0000-1000-8000-00805f9b34fb';
const UUID_TX_HL   = '0000fffb-0000-1000-8000-00805f9b34fb';
const UUID_RX_HL   = '0000fffc-0000-1000-8000-00805f9b34fb';

const UUID_SVC_HS  = '00000001-0000-1000-8000-00805f9b34fb';
const UUID_TX_HS   = '00000002-0000-1000-8000-00805f9b34fb';
const UUID_RX_HS   = '00000003-0000-1000-8000-00805f9b34fb';

const UUID_SVC_JBD = '0000ff00-0000-1000-8000-00805f9b34fb';
const UUID_RX_JBD  = '0000ff01-0000-1000-8000-00805f9b34fb';
const UUID_TX_JBD  = '0000ff02-0000-1000-8000-00805f9b34fb';

const OPTIONAL_SERVICES = [
  UUID_SVC_HL,
  UUID_SVC_HS,
  UUID_SVC_JBD,
  '00001800-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb',
  '11110001-1111-1111-1111-111111111111'
];

const STORAGE_KEY = 'bms_studio_saved_v2';
const sessions = {};
let activeTab = 'visual';
let autoConnecting = false;
let centralPollingBusy = false;

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// iOS/Bluefy: gatt.connect() can hang forever when a device is out of range,
// which would leave `reconnecting` stuck and block polling + all retries.
function withTimeout(promise, ms, label) {
  let t;
  return Promise.race([
    promise,
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error('тайм-аут: ' + label)), ms); })
  ]).finally(() => clearTimeout(t));
}

// Devices the user removed with the ✕ button: auto-connect must not bring them back.
const FORGOT_KEY = 'bms_studio_forgotten_v1';
let forgottenIds = new Set();
try { forgottenIds = new Set(JSON.parse(localStorage.getItem(FORGOT_KEY) || '[]')); } catch (e) {}
function saveForgotten() { try { localStorage.setItem(FORGOT_KEY, JSON.stringify([...forgottenIds])); } catch (e) {} }

function isAnyDeviceConnecting() {
  return autoConnecting || Object.values(sessions).some(s => s.reconnecting);
}

// ---- BLE diagnostics log (shown at the bottom of the "Детально" tab) ----
const bleLogLines = [];
let bleLogOpen = false;
function bleLog(msg) {
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const line = `${t} ${msg}`;
  if (bleLogLines[0] && bleLogLines[0].slice(9) === msg) return;  // collapse repeats
  bleLogLines.unshift(line);
  if (bleLogLines.length > 60) bleLogLines.pop();
}
function devLabel(d) { return `${d.name || '?'} [${String(d.id || '').slice(0, 6)}]`; }
function renderBleLog() {
  const saved = Object.values(sessions).map(s =>
    `${devLabel(s)}: ${s.connected ? '🟢 підключено' : (s.reconnecting ? '⏳ підключається' : '🔴 не підключено')} • ${s.device ? 'запис є' : 'запису немає'}${s.failCount ? ' • невдач ' + s.failCount : ''}`
  );
  const api = !navigator.bluetooth ? 'Bluetooth недоступний у цьому браузері'
    : [
        typeof navigator.bluetooth.getDevices === 'function' ? 'памʼять ✓' : 'памʼять ✗',
        typeof navigator.bluetooth.requestLEScan === 'function' ? 'сканування ✓' : 'сканування ✗',
        (Object.values(sessions).find(x => x.device) || {}).device
          ? (typeof Object.values(sessions).find(x => x.device).device.watchAdvertisements === 'function' ? 'прослуховування ✓' : 'прослуховування ✗')
          : 'прослуховування ?'
      ].join(' • ');
  return `
    <details class="inv-more" style="margin-top:16px" ${bleLogOpen ? 'open' : ''} ontoggle="bleLogOpen=this.open">
      <summary>🔧 Діагностика Bluetooth ▾</summary>
      <div class="inv-kv">
        <div class="row"><span>Можливості браузера</span><b>${api}</b></div>
        ${saved.map(x => `<div class="row no-ua"><span style="white-space:normal">${x}</span></div>`).join('')}
      </div>
      <div class="inv-kv no-ua" style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;max-height:260px;overflow:auto">
        ${bleLogLines.length ? bleLogLines.map(l => `<div style="padding:2px 0;border-bottom:1px solid var(--border)">${l.replace(/</g, '&lt;')}</div>`).join('') : '<div style="color:var(--muted)">поки порожньо</div>'}
      </div>
      <div class="inv-line" style="margin:8px 2px 0"><span></span><span class="link" onclick="copyBleLog()">Скопіювати журнал</span></div>
    </details>`;
}
function copyBleLog() {
  const txt = bleLogLines.slice().reverse().join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => alert('Скопійовано'), () => prompt('Скопіюйте:', txt));
  else prompt('Скопіюйте:', txt);
}

function errText(e) {
  if (!e) return '?';
  return [e.name, e.code !== undefined ? 'code ' + e.code : '', e.message].filter(Boolean).join(' / ');
}

// A device handle from getDevices() is often "stale" on iOS until the phone has seen the
// battery advertise in this app session (Bluefy fails connect() instantly with "2").
// The picker works because it scans first; do the same via watchAdvertisements / requestLEScan.
async function wakeDevice(dev, ms = 8000) {
  if (typeof dev.watchAdvertisements === 'function') {
    return new Promise(async (resolve) => {
      let done = false;
      let ctrl = null;
      try { ctrl = new AbortController(); } catch (e) {}
      const finish = (ok, why) => {
        if (done) return;
        done = true;
        dev.removeEventListener('advertisementreceived', onAdv);
        try { if (ctrl) ctrl.abort(); else if (dev.unwatchAdvertisements) dev.unwatchAdvertisements(); } catch (e) {}
        bleLog(`${devLabel(dev)}: ${why}`);
        resolve(ok);
      };
      const onAdv = (ev) => finish(true, `📡 побачив у ефірі${ev && ev.rssi ? ' (RSSI ' + ev.rssi + ')' : ''}`);
      dev.addEventListener('advertisementreceived', onAdv);
      setTimeout(() => finish(false, `📡 не видно в ефірі ${ms / 1000} с`), ms);
      try {
        await dev.watchAdvertisements(ctrl ? { signal: ctrl.signal } : undefined);
      } catch (e) {
        finish(false, 'watchAdvertisements: ' + errText(e));
      }
    });
  }
  if (navigator.bluetooth && typeof navigator.bluetooth.requestLEScan === 'function') {
    let scan = null;
    try {
      scan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: false });
      const ok = await new Promise((resolve) => {
        const on = (ev) => { if (ev.device && ev.device.id === dev.id) { navigator.bluetooth.removeEventListener('advertisementreceived', on); resolve(true); } };
        navigator.bluetooth.addEventListener('advertisementreceived', on);
        setTimeout(() => { navigator.bluetooth.removeEventListener('advertisementreceived', on); resolve(false); }, ms);
      });
      bleLog(`${devLabel(dev)}: LE scan → ${ok ? 'знайдено' : 'не знайдено'}`);
      return ok;
    } catch (e) {
      bleLog('requestLEScan: ' + errText(e));
    } finally {
      try { if (scan && scan.active) scan.stop(); } catch (e) {}
    }
  }
  return false;
}

let gattLock = Promise.resolve();
function withGattLock(fn) {
  const run = gattLock.then(fn, fn);
  gattLock = run.catch(() => {});
  return run;
}

function isAnyDeviceInitializing() {
  return Object.values(sessions).some(s => s.initializing);
}

// Exponential backoff for batteries that keep failing (out of range / not advertising)
function canRetry(s) {
  return !s.nextRetryAt || Date.now() >= s.nextRetryAt;
}
function noteFailure(s) {
  s.failCount = (s.failCount || 0) + 1;
  s.nextRetryAt = Date.now() + Math.min(60000, 5000 * Math.pow(2, s.failCount - 1));
}

function saveStateToStorage() {
  try {
    const payload = {};
    for (const [id, s] of Object.entries(sessions)) {
      if (s.manualClose) continue;
      payload[id] = {
        id: s.id,
        name: s.name,
        brand: s.brand,
        type: s.type,
        createdAt: s.createdAt || Date.now(),
        lastUpdateStr: s.lastUpdate instanceof Date
          ? s.lastUpdate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
          : s.lastUpdate,
        data: s.data || {}
      };
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {}
}

function restoreCachedSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    for (const [id, item] of Object.entries(saved)) {
      if (!sessions[id]) {
        sessions[id] = {
          id: item.id,
          device: null,
          name: item.name || 'Акумулятор',
          brand: item.brand || detectBrandByName(item.name || ''),
          type: item.type || null,
          server: null,
          txChar: null,
          rxChar: null,
          connected: false,
          reconnecting: false,
          lastUpdate: item.lastUpdateStr ? `${item.lastUpdateStr}` : 'збережено',
          error: null,
          data: item.data || {},
          rxBuf: new Uint8Array(0),
          hsFrames: {},
          polling: false,
          createdAt: item.createdAt || Date.now()
        };
      }
    }
  } catch (e) {}
}

async function tryAutoConnectRemembered(fromUserTap = false) {
  if (autoConnecting) return;
  if (!navigator.bluetooth || typeof navigator.bluetooth.getDevices !== 'function') return;
  autoConnecting = true;
  const statusEl = document.getElementById('live-status-text');
  try {
    const devices = await withTimeout(navigator.bluetooth.getDevices(), 5000, 'памʼять пристроїв');
    bleLog(`запамʼятовані → ${devices && devices.length ? devices.map(devLabel).join(', ') : 'порожньо'}`);
    if (!devices || devices.length === 0) return;

    const todo = devices.filter(dev => {
      const ex = sessions[dev.id];
      if (ex && (ex.connected || ex.reconnecting)) return false;
      if (!fromUserTap && (forgottenIds.has(dev.id) || (ex && ex.manualClose))) return false;
      // Already have a live handle — the 5 s loop takes care of it
      if (ex && ex.device && !fromUserTap) return false;
      return true;
    });
    if (todo.length === 0) return;
    if (statusEl) statusEl.textContent = 'ПОШУК АКБ…';

    // All batteries at once: each one listens for its own advertisement and connects
    // as soon as it is seen; only the GATT setup step is serialized (withGattLock).
    await Promise.all(todo.map(dev => {
      if (fromUserTap) { forgottenIds.delete(dev.id); saveForgotten(); }
      if (sessions[dev.id]) sessions[dev.id].manualClose = false;
      return setupDeviceSession(dev).catch(e => bleLog(`${devLabel(dev)}: ${errText(e)}`));
    }));
  } catch (e) {
    bleLog('помилка памʼяті пристроїв: ' + (e && e.message || e));
  } finally {
    if (statusEl) statusEl.textContent = 'НАЖИВО 2с';
    autoConnecting = false;
  }
}

function switchTab(tabName) {
  activeTab = tabName;
  document.getElementById('tab-btn-visual').classList.toggle('active', tabName === 'visual');
  document.getElementById('tab-btn-details').classList.toggle('active', tabName === 'details');
  document.getElementById('tab-visual').classList.toggle('active', tabName === 'visual');
  document.getElementById('tab-details').classList.toggle('active', tabName === 'details');
  document.getElementById('tab-btn-history').classList.toggle('active', tabName === 'history');
  document.getElementById('tab-history').classList.toggle('active', tabName === 'history');
  if (tabName === 'history') { renderHistoryTab(); hxBoilerPoll(true); hxRefresh(); }
}

async function handleVisualSlotClick(sessionId, connectMode) {
  const s = sessions[sessionId];
  if (!s) {
    // No cached session at all — open filtered BLE picker
    await connectBattery(connectMode);
    return;
  }
  if (!s.connected) {
    // Reconnect via saved handle, falling back to the brand-filtered BLE picker
    await manualReconnect(sessionId, true);
    return;
  }
  // Already connected — switch to Details tab and scroll to its card
  switchTab('details');
  setTimeout(() => {
    const el = document.getElementById('card-' + sessionId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function hexToBytes(hex) {
  const arr = new Uint8Array(hex.length / 2);
  for (let i = 0; i < arr.length; i++) {
    arr[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return arr;
}

function readInt(u8, offset, size, littleEndian = false, signed = false) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  if (size === 1) return signed ? dv.getInt8(offset) : dv.getUint8(offset);
  if (size === 2) return signed ? dv.getInt16(offset, littleEndian) : dv.getUint16(offset, littleEndian);
  if (size === 3) {
    let val = littleEndian
      ? (u8[offset] | (u8[offset + 1] << 8) | (u8[offset + 2] << 16))
      : ((u8[offset] << 16) | (u8[offset + 1] << 8) | u8[offset + 2]);
    if (signed && (val & 0x800000)) val -= 0x1000000;
    return val;
  }
  if (size === 4) return signed ? dv.getInt32(offset, littleEndian) : dv.getUint32(offset, littleEndian);
  return 0;
}

async function writeChar(char, data) {
  if (char.properties && char.properties.writeWithoutResponse) {
    try {
      await char.writeValueWithoutResponse(data);
      return;
    } catch (e) {}
  }
  if (char.properties && char.properties.write) {
    await char.writeValueWithResponse(data);
    return;
  }
  await char.writeValue(data);
}

async function connectBattery(mode) {
  try {
    let options;
    if (mode === 'sandisolar') {
      options = {
        filters: [{ namePrefix: 'HL' }, { namePrefix: 'SH' }],
        optionalServices: OPTIONAL_SERVICES
      };
    } else if (mode === 'humsienk') {
      options = {
        filters: [
          { namePrefix: 'HS' },
          { namePrefix: 'HUM' }
        ],
        optionalServices: OPTIONAL_SERVICES
      };
    } else if (mode === 'sjy') {
      options = {
        filters: [{ namePrefix: 'DP04' }, { namePrefix: 'SJY' }, { namePrefix: 'JBD' }],
        optionalServices: OPTIONAL_SERVICES
      };
    } else {
      options = {
        acceptAllDevices: true,
        optionalServices: OPTIONAL_SERVICES
      };
    }

    const device = await navigator.bluetooth.requestDevice(options);
    bleLog(`вибрано вручну (${mode}): ${devLabel(device)}`);
    await setupDeviceSession(device);
  } catch (err) {
    bleLog(`вибір (${mode}) скасовано/помилка: ${err && err.message || err}`);
  }
}

function detectBrandByName(name) {
  const up = (name || '').toUpperCase();
  if (up.startsWith('HL') || up.startsWith('SH')) return 'Sandisolar';
  if (up.startsWith('HS')) return 'Humsienk';
  if (up.startsWith('DP04') || up.startsWith('JBD') || up.startsWith('SJY')) return 'SJY';
  return 'Акумулятор';
}

function detectConnectModeByBrand(brand) {
  if (brand === 'Sandisolar') return 'sandisolar';
  if (brand === 'SJY') return 'sjy';
  if (brand === 'Humsienk') return 'humsienk';
  return 'all';
}

async function setupDeviceSession(device) {
  const prev = sessions[device.id];
  if (forgottenIds.delete(device.id)) saveForgotten();  // picked again by the user

  // Remove any stale cached entry of same name or brand if ID changed
  for (const [k, v] of Object.entries(sessions)) {
    if (k !== device.id && !v.device && !v.reconnecting && (v.name === device.name || (v.brand === detectBrandByName(device.name || '') && v.brand !== 'Humsienk'))) {
      delete sessions[k];
    }
  }

  const session = {
    id: device.id,
    device: device,
    name: device.name || (prev ? prev.name : 'Акумулятор'),
    brand: detectBrandByName(device.name || (prev ? prev.name : '')),
    type: prev ? prev.type : null,
    server: null,
    txChar: null,
    rxChar: null,
    connected: false,
    reconnecting: false,
    manualClose: false,
    lastUpdate: prev ? prev.lastUpdate : null,
    error: null,
    data: prev && prev.data ? prev.data : {},
    rxBuf: new Uint8Array(0),
    hsFrames: {},
    polling: false,
    createdAt: (prev && prev.createdAt) ? prev.createdAt : Date.now()
  };

  sessions[device.id] = session;
  saveStateToStorage();
  renderCards();

  if (!device._hasDiscListener) {
    device._hasDiscListener = true;
    device.addEventListener('gattserverdisconnected', () => {
      const s = sessions[device.id];
      bleLog(`${devLabel(device)}: розʼєднано`);
      if (!s) return;
      s.connected = false;
      s.polling = false;
      renderCards();
      if (!s.manualClose) {
        setTimeout(() => {
          if (sessions[s.id] && !s.connected && !s.reconnecting) {
            connectAndInit(s);
          }
        }, 1800);
      }
    });
  }

  await connectAndInit(session);
}

async function resolveServiceAndChars(session) {
  const up = (session.name || '').toUpperCase();

  // 1. Direct lookup by known brand/name (avoids getPrimaryServices() failures in Bluefy)
  if (up.startsWith('HL') || up.startsWith('SH') || session.type === 'saihang' || session.brand === 'Sandisolar') {
    const svc = await session.server.getPrimaryService(UUID_SVC_HL);
    session.type = 'saihang';
    session.brand = 'Sandisolar';
    session.txChar = await svc.getCharacteristic(UUID_TX_HL);
    session.rxChar = await svc.getCharacteristic(UUID_RX_HL);
    return;
  }

  if (up.startsWith('HS') || session.type === 'humsienk' || session.brand === 'Humsienk') {
    const svc = await session.server.getPrimaryService(UUID_SVC_HS);
    session.type = 'humsienk';
    session.brand = 'Humsienk';
    session.txChar = await svc.getCharacteristic(UUID_TX_HS);
    session.rxChar = await svc.getCharacteristic(UUID_RX_HS);
    return;
  }

  if (up.startsWith('DP04') || up.startsWith('JBD') || up.startsWith('SJY') || session.type === 'jbd' || session.brand === 'SJY') {
    const svc = await session.server.getPrimaryService(UUID_SVC_JBD);
    session.type = 'jbd';
    session.brand = 'SJY';
    session.txChar = await svc.getCharacteristic(UUID_TX_JBD);
    session.rxChar = await svc.getCharacteristic(UUID_RX_JBD);
    return;
  }

  // 2. Fallback: probe each known service directly
  try {
    const svc = await session.server.getPrimaryService(UUID_SVC_HL);
    session.type = 'saihang';
    session.brand = 'Sandisolar';
    session.txChar = await svc.getCharacteristic(UUID_TX_HL);
    session.rxChar = await svc.getCharacteristic(UUID_RX_HL);
    return;
  } catch (e) {}

  try {
    const svc = await session.server.getPrimaryService(UUID_SVC_JBD);
    session.type = 'jbd';
    session.brand = 'SJY';
    session.txChar = await svc.getCharacteristic(UUID_TX_JBD);
    session.rxChar = await svc.getCharacteristic(UUID_RX_JBD);
    return;
  } catch (e) {}

  try {
    const svc = await session.server.getPrimaryService(UUID_SVC_HS);
    session.type = 'humsienk';
    session.brand = 'Humsienk';
    session.txChar = await svc.getCharacteristic(UUID_TX_HS);
    session.rxChar = await svc.getCharacteristic(UUID_RX_HS);
    return;
  } catch (e) {}

  throw new Error('Не вдалося знайти сервіс BMS');
}

async function connectAndInit(session) {
  if (!session.device || session.reconnecting) return false;
  session.reconnecting = true;
  renderCards();
  const tStart = Date.now();

  try {
    for (let attempt = 1; attempt <= 3; attempt++) {
      let t0 = Date.now();
      try {
        session.error = null;
        session.polling = false;

        // 1st try is direct (free when the handle is fresh). After a failure, wait until
        // the battery is actually seen advertising, then connect right away.
        if (attempt > 1) await wakeDevice(session.device, attempt === 3 ? 12000 : 8000);
        t0 = Date.now();
        session.server = await withTimeout(session.device.gatt.connect(), 12000, 'підключення');

        await withGattLock(async () => {
          session.initializing = true;
          try {
            await withTimeout(resolveServiceAndChars(session), 8000, 'сервіси');
            await withTimeout(session.rxChar.startNotifications(), 5000, 'сповіщення');
            if (session.rxHandler) {
              try { session.rxChar.removeEventListener('characteristicvaluechanged', session.rxHandler); } catch (e) {}
            }
            session.rxHandler = (ev) => {
              const chunk = new Uint8Array(ev.target.value.buffer, ev.target.value.byteOffset, ev.target.value.byteLength);
              onRxData(session, chunk);
            };
            session.rxChar.addEventListener('characteristicvaluechanged', session.rxHandler);
            session.connected = true;
            if (session.type === 'humsienk') {
              await writeChar(session.txChar, hexToBytes('aa00000000'));
              await sleep(200);
            }
            await pollSession(session, true);
          } finally {
            session.initializing = false;
          }
        });

        bleLog(`${devLabel(session)}: ✅ підключено за ${((Date.now() - tStart) / 1000).toFixed(1)} с (спроба ${attempt})`);
        session.failCount = 0;
        session.nextRetryAt = 0;
        return true;
      } catch (innerErr) {
        bleLog(`${devLabel(session)}: ❌ спроба ${attempt}: ${errText(innerErr)}`);
        session.connected = false;
        try { if (session.device.gatt.connected) session.device.gatt.disconnect(); } catch (e) {}
        // Instant failures (stale handle) go straight to listening; only pause after slow ones
        if (attempt < 3 && Date.now() - t0 > 1500) await sleep(600);
      }
    }
    noteFailure(session);
    return false;
  } finally {
    session.initializing = false;
    session.reconnecting = false;
    renderCards();
  }
}

function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

function onRxData(session, chunk) {
  if (session.type === 'saihang') {
    if (chunk.length >= 2 && chunk[0] === 0xa5 && chunk[1] === 0xa5) {
      session.rxBuf = chunk;
    } else {
      session.rxBuf = concatBytes(session.rxBuf, chunk);
    }
    if (session.rxBuf.length >= 7 && session.rxBuf[0] === 0xa5 && session.rxBuf[1] === 0xa5) {
      const expectedLen = 7 + session.rxBuf[4];
      if (session.rxBuf.length >= expectedLen) {
        parseSaihang(session, session.rxBuf.slice(0, expectedLen));
        session.rxBuf = new Uint8Array(0);
      }
    }
  } else if (session.type === 'humsienk') {
    if (chunk.length >= 5 && chunk[0] === 0xaa) {
      session.hsFrames[chunk[1]] = chunk;
      parseHumsienk(session);
    }
  } else if (session.type === 'jbd') {
    if (chunk.length >= 4 && chunk[0] === 0xdd && (chunk[1] === 0x03 || chunk[1] === 0x04 || chunk[1] === 0x05)) {
      session.rxBuf = chunk;
    } else {
      session.rxBuf = concatBytes(session.rxBuf, chunk);
    }
    if (session.rxBuf.length >= 7 && session.rxBuf[0] === 0xdd) {
      const expectedLen = 7 + session.rxBuf[3];
      if (session.rxBuf.length >= expectedLen && session.rxBuf[expectedLen - 1] === 0x77) {
        parseJbdFrame(session, session.rxBuf.slice(0, expectedLen));
        session.rxBuf = new Uint8Array(0);
      }
    }
  }
}

function parseSaihang(session, m) {
  const current = readInt(m, 5, 4, false, true) / 100.0;
  const voltage = readInt(m, 9, 4, false, false) / 100.0;
  const soc = readInt(m, 13, 2, false, false);
  const soh = readInt(m, 15, 2, false, false);
  const remCap = readInt(m, 17, 4, false, false) / 100.0;
  const nomCap = readInt(m, 25, 4, false, false) / 100.0;
  const cycles = readInt(m, 29, 2, false, false);
  const problemCode = (~readInt(m, 31, 2, false, false)) & 0xFFFF;
  const mosBits = readInt(m, 37, 2, false, false);
  const chgMos = Boolean(mosBits & 0x0200);
  const dsgMos = Boolean(mosBits & 0x0400);
  const balMask = readInt(m, 41, 2, false, false);
  const cellCount = Math.min(readInt(m, 43, 2, false, false), 20);

  const cells = [];
  for (let i = 0; i < cellCount; i++) {
    const pos = 45 + i * 2;
    if (pos + 2 <= m.length) {
      cells.push(readInt(m, pos, 2, false, false) / 1000.0);
    }
  }

  const tempSensors = Math.min(readInt(m, 85, 2, false, false), 10);
  const temps = [];
  for (let i = 0; i < tempSensors; i++) {
    const pos = 87 + i * 2;
    if (pos + 2 <= m.length) {
      const rawT = readInt(m, pos, 2, false, true);
      if (rawT !== 0) temps.push(((rawT - 2730) / 10.0).toFixed(1));
    }
  }

  session.data = {
    voltage, current, power: voltage * current,
    soc, soh, remCap, nomCap, cycles,
    chgMos, dsgMos, balMask, cells, temps, problemCode
  };
  session.lastUpdate = new Date();
  session.error = null;
  saveStateToStorage();
  renderCards();
}

function parseHumsienk(session) {
  const m20 = session.hsFrames[0x20];
  const m21 = session.hsFrames[0x21];
  const m22 = session.hsFrames[0x22];
  const d = Object.assign({}, session.data);

  if (m21 && m21.length >= 25) {
    d.voltage = readInt(m21, 3, 4, true, false) / 1000.0;
    d.current = readInt(m21, 7, 4, true, true) / 1000.0;
    d.power = d.voltage * d.current;
    d.soc = readInt(m21, 11, 1, true, false);
    d.soh = readInt(m21, 12, 1, true, false);
    d.remCap = readInt(m21, 13, 4, true, false) / 1000.0;
    d.nomCap = readInt(m21, 17, 4, true, false) / 1000.0;
    d.cycles = readInt(m21, 21, 2, true, false);

    const temps = [];
    for (let i = 0; i < 4; i++) {
      if (23 + i < m21.length - 2) {
        const tv = readInt(m21, 23 + i, 1, true, true);
        if (tv !== 0) temps.push(tv.toFixed(0));
      }
    }
    d.temps = temps;
  }

  if (m20 && m20.length >= 16) {
    d.chgMos = Boolean(m20[7] & 0x80);
    d.dsgMos = Boolean(m20[9] & 0x80);
    d.balMask = readInt(m20, 11, 3, true, false);
    d.problemCode = (readInt(m20, 7, 4, true, false) & 0xFF7F7F7F) >>> 0;
  }

  if (m22 && m22.length >= 7) {
    const cells = [];
    for (let i = 0; i < 24; i++) {
      const pos = 3 + i * 2;
      if (pos + 2 <= m22.length - 2) {
        const cv = readInt(m22, pos, 2, true, false);
        if (cv > 0) cells.push(cv / 1000.0);
      }
    }
    d.cells = cells;
  }

  session.data = d;
  session.lastUpdate = new Date();
  session.error = null;
  saveStateToStorage();
  renderCards();
}

function parseJbdFrame(session, f) {
  const cmd = f[1];
  const d = Object.assign({}, session.data);

  if (cmd === 0x03 && f.length >= 27) {
    const tempCount = f[26];
    const ctrlPos = 27 + 2 * tempCount;
    const isD10 = (ctrlPos < f.length - 3) && Boolean(f[ctrlPos] & 0x80);
    const scale = isD10 ? 10.0 : 100.0;

    d.voltage = readInt(f, 4, 2, false, false) / 100.0;
    d.current = readInt(f, 6, 2, false, true) / scale;
    d.power = d.voltage * d.current;
    d.remCap = readInt(f, 8, 2, false, false) / scale;
    d.nomCap = readInt(f, 10, 2, false, false) / scale;
    d.cycles = readInt(f, 12, 2, false, false);

    const balLow = readInt(f, 16, 2, false, false);
    const balHigh = readInt(f, 18, 2, false, false);
    d.balMask = ((balHigh << 16) | balLow) >>> 0;

    d.problemCode = readInt(f, 20, 2, false, false);
    d.soc = f[23];
    d.chgMos = Boolean(f[24] & 0x01);
    d.dsgMos = Boolean(f[24] & 0x02);

    const temps = [];
    for (let i = 0; i < tempCount; i++) {
      const pos = 27 + i * 2;
      if (pos + 2 <= f.length - 3) {
        const rawK = readInt(f, pos, 2, false, false);
        temps.push(((rawK - 2731) / 10.0).toFixed(1));
      }
    }
    d.temps = temps;
  } else if (cmd === 0x04) {
    const nCells = Math.floor((f.length - 7) / 2);
    const cells = [];
    for (let i = 0; i < nCells; i++) {
      const cv = readInt(f, 4 + i * 2, 2, false, false);
      if (cv > 0) cells.push(cv / 1000.0);
    }
    d.cells = cells;
  }

  session.data = d;
  session.lastUpdate = new Date();
  session.error = null;
  saveStateToStorage();
  renderCards();
}

async function pollSession(session, force = false) {
  if (!session || !session.connected) return;
  if (!force && isAnyDeviceInitializing()) return;
  const now = Date.now();
  if (session.polling && session.pollStart && (now - session.pollStart < 3500)) return;
  session.polling = true;
  session.pollStart = now;
  try {
    if (session.type === 'saihang') {
      await writeChar(session.txChar, hexToBytes('a5a5000300000036c40d'));
      await sleep(220);
    } else if (session.type === 'humsienk') {
      for (const hex of ['aa20002000', 'aa21002100', 'aa22002200']) {
        await writeChar(session.txChar, hexToBytes(hex));
        await sleep(190);
      }
    } else if (session.type === 'jbd') {
      await writeChar(session.txChar, hexToBytes('dda50300fffd77'));
      await sleep(240);
      await writeChar(session.txChar, hexToBytes('dda50400fffc77'));
      await sleep(200);
    }
  } catch (err) {
  } finally {
    session.polling = false;
  }
}

// Single sequential polling scheduler so multiple BLE batteries never collide on iOS Bluefy
setInterval(async () => {
  if (centralPollingBusy || isAnyDeviceInitializing()) return;
  centralPollingBusy = true;
  try {
    const activeList = Object.values(sessions).filter(s => s.connected);
    for (const s of activeList) {
      if (isAnyDeviceInitializing()) break;
      await pollSession(s);
      await sleep(220);
    }
  } finally {
    centralPollingBusy = false;
  }
}, 2200);

async function manualReconnect(id, fallbackToPicker = true) {
  const s = sessions[id];
  if (!s) return;
  s.manualClose = false;
  const mode = detectConnectModeByBrand(s.brand);

  if (s.device) {
    const ok = await connectAndInit(s);
    if (ok) return;
  }

  // If direct GATT connect wasn't permitted by Bluefy without picker, open filtered BLE picker
  if (fallbackToPicker) {
    await connectBattery(mode);
  }
}

function disconnectDevice(id) {
  const s = sessions[id];
  if (!s) return;
  s.manualClose = true;
  forgottenIds.add(id);
  saveForgotten();
  try {
    if (s.device && s.device.gatt && s.device.gatt.connected) {
      s.device.gatt.disconnect();
    }
  } catch (e) {}
  delete sessions[id];
  saveStateToStorage();
  renderCards();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    tryAutoConnectRemembered(false);
  }
});

// Saved batteries without a live handle (fresh page load, Bluetooth was off, out of range):
// keep asking Bluefy/Chrome for the remembered devices instead of trying only once on load.
setInterval(() => {
  if (isAnyDeviceConnecting()) return;
  const missing = Object.values(sessions).some(s => !s.device && !s.manualClose && canRetry(s));
  const none = Object.keys(sessions).length === 0;
  if (missing || none) tryAutoConnectRemembered(false);
}, 8000);

// Background auto-reconnect every 5 seconds for remembered devices that have a live handle
setInterval(() => {
  if (isAnyDeviceConnecting()) return;
  const disconnectedWithDevice = Object.values(sessions).filter(s => !s.connected && !s.manualClose && s.device && canRetry(s));
  if (disconnectedWithDevice.length > 0) {
    (async () => {
      for (const s of disconnectedWithDevice) {
        if (!s.connected && !s.reconnecting) {
          await connectAndInit(s);
          await sleep(700);
        }
      }
    })();
  }
}, 5000);

function fmt(v, digits = 2) {
  return (v !== undefined && v !== null && !isNaN(v)) ? Number(v).toFixed(digits) : '—';
}

function getCellDeltaMv(session) {
  if (!session || !session.data || !session.data.cells || session.data.cells.length === 0) return null;
  const cells = session.data.cells;
  return Math.round((Math.max(...cells) - Math.min(...cells)) * 1000);
}

function formatHoursMinutes(hrs) {
  if (!hrs || isNaN(hrs) || hrs <= 0) return '0 хв';
  if (hrs > 72) return '> 72 год';
  const h = Math.floor(hrs);
  const m = Math.round((hrs - h) * 60);
  if (m === 60) return `${h + 1} год 0 хв`;
  return `${h > 0 ? h + ' год ' : ''}${m} хв`;
}

function getEffectiveRemAh(d) {
  if (!d) return 0;
  const nom = d.nomCap || 100;
  if (d.remCap !== undefined && d.remCap !== null && d.remCap > 0) return d.remCap;
  if (d.soc !== undefined && d.soc !== null) return (d.soc / 100) * nom;
  return 0;
}

function formatEta(d, shortMode = false) {
  if (!d) return '—';
  const cur = d.current || 0;
  const nom = d.nomCap || 100;
  const rem = getEffectiveRemAh(d);
  if (rem <= 0 && d.soc === undefined) return 'Очікування даних';

  if (cur < -0.08) {
    const hrs = rem / Math.abs(cur);
    return (shortMode ? '⏱ ~' : '⏱ Залишилось ~') + formatHoursMinutes(hrs);
  }
  if (cur > 0.08) {
    const soc = (d.soc !== undefined && d.soc !== null) ? d.soc : null;
    let need = nom - rem;
    if (need <= 0 && soc !== null) need = (100 - soc) / 100 * nom;   // Ah counter ran past nominal: trust SOC
    if (need <= 0 || (soc !== null && soc >= 95)) return shortMode ? '⚡ дозаряд' : '⚡ Дозаряд (кінець заряду)';
    return (shortMode ? '⚡ ~' : '⚡ Повний через ~') + formatHoursMinutes(Math.max(0.03, need / cur));
  }
  return shortMode ? `🔋 ${rem.toFixed(0)} Ah` : '⏱ Режим очікування';
}

function getTopologySlots(list) {
  const sandi = list.find(s => s.brand === 'Sandisolar') || null;
  const sjy = list.find(s => s.brand === 'SJY') || null;
  const hums = list
    .filter(s => s.brand === 'Humsienk')
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const hs1 = hums[0] || null;
  const hs2 = hums[1] || null;
  return { sandi, sjy, hs1, hs2 };
}

function renderVisualBatterySlot(session, title, poleText, subtitle, connectMode, isStandby = false) {
  if (!session) {
    return `
      <div class="vis-bat-card empty-slot" onclick="connectBattery('${connectMode}')">
        <div class="vis-bat-top">
          <span class="vis-bat-name">${title}</span>
          <span class="vis-pole">${poleText}</span>
        </div>
        <div style="font-size:12px; color:var(--muted); margin: 10px 0;">${subtitle}</div>
        <div style="font-size:11px; font-weight:800; color:#60a5fa;">＋ Підключити BLE</div>
      </div>
    `;
  }

  const d = session.data || {};
  const soc = d.soc !== undefined ? d.soc : 0;
  const deltaMv = getCellDeltaMv(session);
  const cur = d.current !== undefined ? `${d.current >= 0 ? '+' : ''}${d.current.toFixed(1)} A` : '—';
  const stateCls = !session.connected
    ? 'disconnected-slot'
    : (isStandby ? 'standby-conn' : 'connected');
  const dotCls = session.connected ? '' : (session.reconnecting ? 'connecting' : 'off');
  const statusHint = session.connected
    ? (deltaMv !== null ? `Δ <b>${deltaMv}</b>mV` : 'Деталі →')
    : (session.reconnecting ? '⏳ З’єднання...' : '<b style="color:#60a5fa;">⚡ Підключити</b>');

  return `
    <div class="vis-bat-card ${stateCls}" onclick="handleVisualSlotClick('${session.id}', '${connectMode}')">
      <div>
        <div class="vis-bat-top">
          <span class="vis-bat-name">
            <span class="dot ${dotCls}"></span>
            ${title}
          </span>
          <span class="vis-pole">${poleText}</span>
        </div>

        <div class="vis-soc-row">
          <span class="vis-soc">${d.soc !== undefined ? d.soc + '%' : '—'}</span>
          <span class="vis-v">${fmt(d.voltage, 2)} V</span>
        </div>

        <div class="vis-bar">
          <div class="vis-bar-fill" style="width:${Math.min(100, Math.max(4, soc))}%"></div>
        </div>

      </div>

      <div class="vis-meta-grid">
        <span><b>${cur}</b></span>
        <span>${statusHint}</span>
      </div>
    </div>
  `;
}


// ===== Remaining-time model (BMS + inverter settings + inverter live data) =====
// Defaults = this inverter's current settings; replaced by live values once read.
const ETA_DEFAULTS = { offSoc: 15, gridSoc: 20, offV: 25.0, gridV: 26.0, maxChgA: 30, cvMin: 60 };
const etaState = { ema: null, t: 0, sign: 0 };
const ETA_HOME_W = 300;   // typical battery-side draw during an outage, W (owner's figure; measured average was ~175-220)

// LiFePO4 resting voltage per cell vs SOC (typical curve), 24V bus = 8 cells
const LFP_OCV = [[0, 2.90], [5, 3.10], [10, 3.18], [15, 3.21], [20, 3.24], [30, 3.26], [40, 3.28],
                 [50, 3.29], [60, 3.30], [70, 3.31], [80, 3.32], [90, 3.33], [95, 3.34], [100, 3.36]];
function socForCellOcv(v) {
  if (v <= LFP_OCV[0][1]) return 0;
  for (let i = 1; i < LFP_OCV.length; i++) {
    const [s0, v0] = LFP_OCV[i - 1], [s1, v1] = LFP_OCV[i];
    if (v <= v1) return s0 + (s1 - s0) * (v - v0) / (v1 - v0);
  }
  return 100;
}

// Bus internal resistance (cells + BMS + links), learned from current steps:
// V = OCV + I·R  ⇒  R = ΔV/ΔI. Your log: 26.62 V @ −4 A → 25.78 V @ −65 A ⇒ ≈ 14 mΩ.
const R_KEY = 'bms_studio_bus_r_v1';
let busR = 0.016;
try { const r = parseFloat(localStorage.getItem(R_KEY)); if (r > 0.004 && r < 0.08) busR = r; } catch (e) {}
let rPrev = null;
function etaLearnR(V, I) {
  const now = Date.now();
  if (V && rPrev && now - rPrev.t < 15000 && Math.abs(I - rPrev.I) > 8) {
    const r = (V - rPrev.V) / (I - rPrev.I);
    if (r > 0.004 && r < 0.08) {
      busR += (r - busR) * 0.3;
      try { localStorage.setItem(R_KEY, busR.toFixed(4)); } catch (e) {}
    }
  }
  if (V) rPrev = { V, I, t: now };
}

// SOC at which the LOADED bus voltage reaches the inverter's cut-off
function socAtVoltageCut(cutV, Idis) {
  const ocvBus = cutV + Math.abs(Idis) * busR;
  return socForCellOcv(ocvBus / 8);
}

// Loads jump around (kettle, fridge compressor): average the bus current over ~3 min.
// Reset on charge <-> discharge flip so the estimate reacts at once.
function etaSmooth(I) {
  const now = Date.now();
  const sign = I > 0.3 ? 1 : (I < -0.3 ? -1 : 0);
  if (etaState.ema === null || sign !== etaState.sign || now - etaState.t > 60000) {
    etaState.ema = I; etaState.sign = sign; etaState.t = now;
    return I;
  }
  const dt = (now - etaState.t) / 1000;
  etaState.t = now;
  etaState.ema += (I - etaState.ema) * (1 - Math.exp(-dt / 15));
  return etaState.ema;
}

function etaParams() {
  const p = { ...ETA_DEFAULTS, fromInverter: false };
  const st = inv && inv.settings;
  if (st) {
    const n = k => invNum(st[k]);
    if (n('bat_lithium_low_soc_protection_point') !== null) { p.offSoc = n('bat_lithium_low_soc_protection_point'); p.fromInverter = true; }
    if (n('bat_mains_mode_lithium_soc_protection_point') !== null) p.gridSoc = n('bat_mains_mode_lithium_soc_protection_point');
    if (n('bat_low_voltage_battery_protection_point')) p.offV = n('bat_low_voltage_battery_protection_point');
    if (n('bat_low_voltage_point_of_battery_in_mains_mode')) p.gridV = n('bat_low_voltage_point_of_battery_in_mains_mode');
    if (n('bat_maximum_charging_current')) p.maxChgA = n('bat_maximum_charging_current');
    if (n('bat_constant_pressure_floating_charge_waiting_time') !== null) p.cvMin = n('bat_constant_pressure_floating_charge_waiting_time');
  }
  return p;
}

/*
 strings: [{ nom, remMin, remMax }] for every 24V string on the bus.
   Series pair: discharge ends when the EMPTIER battery hits the floor (remMin),
   charge ends when the FULLER one is full and its BMS stops the string (remMax).
 I: bus current, A (+ charge / − discharge), V: bus voltage
*/
function computeSystemEta(strings, I, V) {
  const P = etaParams();
  const d = inv && inv.data;
  const gridOn = Boolean(d && d.gridV && d.gridV > 100);
  const Iavg = etaSmooth(I);
  const nomAll = strings.reduce((a, x) => a + x.nom, 0);
  const remAll = strings.reduce((a, x) => a + x.remMin, 0);
  const Vb = V || 25.6;
  const src = P.fromInverter ? 'з інвертора' : 'типові';

  if (!strings.length || nomAll <= 0) {
    return { cls: '', label: '⏱ Час роботи:', value: 'Очікування даних BMS', sub: '' };
  }

  // ---- Discharging ----
  if (Iavg < -0.3) {
    const socFloor = gridOn ? P.gridSoc : P.offSoc;
    const cutV = gridOn ? P.gridV : P.offV;
    const vFloor = socAtVoltageCut(cutV, Iavg);
    const byVoltage = vFloor > socFloor + 0.5;
    const floor = Math.max(socFloor, vFloor);
    const usable = strings.reduce((a, x) => a + Math.max(0, x.remMin - floor / 100 * x.nom), 0);
    const hrs = usable / Math.abs(Iavg);
    const sub = `при ~${Math.round(Math.abs(Iavg) * Vb)} W (середнє за ~15 с) • ` + (byVoltage
      ? `до ~${Math.round(floor)}%: під навантаженням напруга впаде до ${cutV} V раніше, ніж заряд до ${socFloor}%`
      : `до ${socFloor}% заряду (поріг ${src})`);
    return {
      cls: 'discharging',
      label: gridOn ? '⏱ До переходу на мережу:' : '⏱ До відключення інвертора:',
      value: usable > 0 ? `~${formatHoursMinutes(hrs)}` : 'на порозі',
      sub
    };
  }

  // ---- Charging: CC up to ~95%, then C.V hold (current tapers), then float ----
  if (Iavg > 0.3) {
    const needCC = strings.reduce((a, x) => a + Math.max(0, 0.95 * x.nom - x.remMax), 0);
    const needAll = strings.reduce((a, x) => a + Math.max(0, x.nom - x.remMax), 0);
    const tCC = needCC / Iavg;
    const tail = needAll - needCC;
    const tCV = Math.min(P.cvMin / 60, tail / Math.max(0.5, Iavg * 0.35));
    const limited = P.maxChgA && Iavg >= P.maxChgA * 0.9;
    const sub = `~${Iavg.toFixed(1)} A${limited ? ` (ліміт інвертора ${P.maxChgA} A)` : ''}` +
      (needCC > 0 ? ` • до 95% ~${formatHoursMinutes(tCC)} + витримка напруги` : (needAll <= 0 ? ' • струм спадає, інвертор тримає напругу' : ` • витримка напруги до ${P.cvMin} хв`));
    return {
      cls: 'charging',
      label: needCC > 0 ? '⚡ До повного заряду:' : '⚡ Дозаряд (витримка):',
      // BMS counters already at/over nominal: only the inverter's voltage hold is left, its end is not predictable
      value: needAll <= 0 ? `до ${P.cvMin} хв` : `~${formatHoursMinutes(Math.max(0.03, tCC + tCV))}`,
      sub
    };
  }

  // ---- Idle: what happens if the grid goes down right now ----
  if (d && (d.loadVA !== null || d.loadW !== null)) {
    // With the grid present the current load says little (flat may bypass the inverter, boiler runs only on grid):
    // estimate the outage runtime for the typical home load instead.
    const learned = gridOn ? hxTypicalW() : null;
    const homeW = learned || ETA_HOME_W;
    const loadW = gridOn ? homeW : Math.max(d.loadW || 0, (d.loadVA || 0) * 0.7);
    // ETA_HOME_W is battery-side power (what the site showed during outages), so no inverter losses on top
    const drawW = gridOn ? loadW : loadW / 0.92 + 40;   // measured output load: add efficiency + ~40 W own consumption
    const floorIdle = Math.max(P.offSoc, socAtVoltageCut(P.offV, drawW / Vb));
    const usable = strings.reduce((a, x) => a + Math.max(0, x.remMin - floorIdle / 100 * x.nom), 0);
    const hrs = (usable * Vb) / drawW;
    return {
      cls: '',
      label: gridOn ? '🔋 Якщо зникне мережа:' : '⏱ Час роботи:',
      value: `~${formatHoursMinutes(hrs)}`,
      sub: (gridOn ? (learned ? `при середньому розряді ${homeW} W (за відключеннями тижня)` : `при типовому розряді ${homeW} W з батареї`) : `навантаження ~${Math.round(loadW)} W + втрати інвертора`) + ` • до ${Math.round(floorIdle)}% заряду`
    };
  }
  const hrs300 = (Math.max(0, remAll - P.offSoc / 100 * nomAll) * Vb) / 300;
  return { cls: '', label: '⏱ Резерв:', value: `~${formatHoursMinutes(hrs300)}`, sub: `оцінка при 300 W • до ${P.offSoc}% заряду` };
}

// ---- Is string B (Humsienk pair) actually wired in parallel to the inverter bus? ----
// An unconnected string carries no current, and parallel strings are forced to the same voltage.
// The decision needs ~20 s of consistent evidence; at rest the last known state is kept.
const STRB_KEY = 'bms_studio_strB_v1';
let strB = { auto: null, manual: null, pend: null, pendAt: 0 };
try { strB = Object.assign(strB, JSON.parse(localStorage.getItem(STRB_KEY) || '{}')); } catch (e) {}
function strBSave() { try { localStorage.setItem(STRB_KEY, JSON.stringify({ auto: strB.auto, manual: strB.manual })); } catch (e) {} }
function strBSetManual(v) { strB.manual = v || null; strBSave(); renderCards(); }

function strBDetect({ vA, iA, aOk, vB, iB, bOk }) {
  if (!bOk) return;
  let ev = null;
  if (Math.abs(iB) >= 0.5) ev = 'on';                                    // current flows -> wired to something
  else {
    let iRef = aOk ? iA : null;
    if (iRef === null && inv.data && inv.data.batA !== null && Date.now() - (inv.data.ts || 0) < 7 * 60000) iRef = inv.data.batA;
    if (iRef !== null && Math.abs(iRef) >= 3) ev = 'off';               // bus works hard, string B idle
  }
  if (aOk && Math.abs(iA) < 2 && Math.abs(vA - vB) > 0.5) ev = 'off';   // at rest parallel strings can't differ
  if (!ev || ev === strB.auto) { strB.pend = null; return; }
  if (strB.pend !== ev) { strB.pend = ev; strB.pendAt = Date.now(); return; }
  if (Date.now() - strB.pendAt >= 20000) { strB.auto = ev; strB.pend = null; strBSave(); }
}
function strBState() { return strB.manual || strB.auto; }   // 'on' | 'off' | null (unknown)

function renderStringCard(o) {
  const st = o.state;   // 'on' | 'off' | null
  const chip = st === 'on' ? '<span class="str-chip on">● в роботі</span>'
    : st === 'off' ? '<span class="str-chip off">○ не підключена</span>'
    : '<span class="str-chip">◌ не визначено</span>';
  const select = o.manualSel === undefined ? '' : `
    <select class="str-sel" onchange="strBSetManual(this.value)" title="Як визначати підключення до інвертора">
      <option value="" ${!o.manualSel ? 'selected' : ''}>авто</option>
      <option value="on" ${o.manualSel === 'on' ? 'selected' : ''}>вручну: підключена</option>
      <option value="off" ${o.manualSel === 'off' ? 'selected' : ''}>вручну: не підключена</option>
    </select>`;
  return `
      <div class="string-card ${st === 'on' ? 'active-string' : 'standby-string'}">
        <div class="string-head">
          <div>
            <div class="string-title">${o.icon} ${o.title}</div>
            <div class="string-sub">${o.sub}</div>
          </div>
          <div class="str-right">
            <span class="string-badge ${st === 'on' ? '' : 'standby'}">${o.volt ? o.volt.toFixed(2) + ' V' : '—'}</span>
            ${chip}${select}
          </div>
        </div>
        <div class="series-visual">
          <div class="series-pair-grid">${o.slots}</div>
          <div class="balancer-bridge ${o.balCls}">
            <div class="bal-left"><span>${o.balIcon}</span><span>${o.balLabel}</span></div>
            <div class="bal-right">${o.balText}</div>
          </div>
          ${o.hint || ''}
        </div>
      </div>`;
}

function renderTopology(list) {
  const panel = document.getElementById('topology-panel');
  const { sandi, sjy, hs1, hs2 } = getTopologySlots(list);

  // String A (Sandisolar + SJY in series 24V)
  const vSandi = sandi && sandi.data.voltage ? sandi.data.voltage : 0;
  const vSjy   = sjy && sjy.data.voltage ? sjy.data.voltage : 0;
  const stringAComplete = Boolean(vSandi > 0 && vSjy > 0);
  const stringAVolt = vSandi + vSjy;

  let stringACurrent = 0;
  if (sandi && sandi.data.current !== undefined && sjy && sjy.data.current !== undefined) {
    stringACurrent = (sandi.data.current + sjy.data.current) / 2;
  } else if (sandi && sandi.data.current !== undefined) {
    stringACurrent = sandi.data.current;
  } else if (sjy && sjy.data.current !== undefined) {
    stringACurrent = sjy.data.current;
  }
  const stringAPower = (sandi ? (sandi.data.power || 0) : 0) + (sjy ? (sjy.data.power || 0) : 0);

  // Inter-battery delta on String A (External 24V Active Balancer)
  let balACls = 'inactive';
  let balAText = 'Підключіть обидва АКБ гілки А';
  if (stringAComplete) {
    const balADeltaMv = Math.round(Math.abs(vSandi - vSjy) * 1000);
    balACls = balADeltaMv <= 60 ? '' : (balADeltaMv <= 220 ? 'warn' : 'bad');
    balAText = `Δ між АКБ: ${(balADeltaMv / 1000).toFixed(2)} V (${balADeltaMv} mV)`;
  }

  // String B (Humsienk #1 + Humsienk #2 in series 24V)
  const vHs1 = hs1 && hs1.data.voltage ? hs1.data.voltage : 0;
  const vHs2 = hs2 && hs2.data.voltage ? hs2.data.voltage : 0;
  const stringBComplete = Boolean(vHs1 > 0 && vHs2 > 0);
  const stringBVolt = vHs1 + vHs2;

  let stringBCurrent = 0;
  if (stringBComplete) {
    stringBCurrent = ((hs1.data.current || 0) + (hs2.data.current || 0)) / 2;
  } else if (hs1 && hs1.data.current !== undefined) {
    stringBCurrent = hs1.data.current;
  }
  const stringBPower = (hs1 ? (hs1.data.power || 0) : 0) + (hs2 ? (hs2.data.power || 0) : 0);
  const fresh = x => x && x.connected && x.data && x.data.current !== undefined;
  strBDetect({ vA: stringAVolt, iA: stringACurrent, aOk: stringAComplete && fresh(sandi) && fresh(sjy),
               vB: stringBVolt, iB: stringBCurrent, bOk: stringBComplete && fresh(hs1) && fresh(hs2) });
  const stringBState = strBState();                    // wiring state is remembered even if a BMS is out of BLE range
  const stringBActive = stringBState === 'on';
  const stringBUse = stringBActive && stringBComplete;   // its numbers can only be summed when both BMS are read

  let balBCls = 'inactive';
  let balBText = 'Підключіть обидва АКБ гілки Б';
  if (stringBComplete) {
    const balBDeltaMv = Math.round(Math.abs(vHs1 - vHs2) * 1000);
    balBCls = balBDeltaMv <= 60 ? '' : (balBDeltaMv <= 220 ? 'warn' : 'bad');
    balBText = `Δ між АКБ: ${(balBDeltaMv / 1000).toFixed(2)} V (${balBDeltaMv} mV)`;
  }

  // Before wiring string B in parallel: the strings should be within ~0.2 V, otherwise a big inrush current
  let strBHint = '';
  if (stringBComplete && !stringBActive && stringAComplete) {
    const dv = stringBVolt - stringAVolt;
    const okDv = Math.abs(dv) <= 0.2;
    const loadNote = Math.abs(stringACurrent) >= 2 ? ' (гілка А під струмом — точніше видно в спокої)' : '';
    strBHint = `<div class="str-hint ${okDv ? 'ok' : 'warn'}">${okDv
      ? `✅ Різниця з гілкою А ${dv >= 0 ? '+' : ''}${dv.toFixed(2)} V — можна підключати паралельно`
      : `⚠️ Різниця з гілкою А ${dv >= 0 ? '+' : ''}${dv.toFixed(2)} V — вирівняйте до 0.2 V перед підключенням (зарядіть обидві до повного)`}${loadNote}</div>`;
  }

  // 24V Main Inverter Bus Summary
  let busVoltNum = null;
  let busVoltSuffix = '';
  if (stringAComplete && stringBUse) {
    busVoltNum = (stringAVolt + stringBVolt) / 2;
  } else if (stringAComplete) {
    busVoltNum = stringAVolt;
  } else if (stringBUse) {
    busVoltNum = stringBVolt;
  } else if (vSandi > 0 || vSjy > 0) {
    busVoltNum = vSandi + vSjy;
    busVoltSuffix = ' (1/2)';
  }

  const bmsBusV = busVoltNum;
  let anyActive = Boolean(vSandi || vSjy || stringBUse);
  let totalCurrent = stringACurrent + (stringBUse ? stringBCurrent : 0);
  let totalPower = stringAPower + (stringBUse ? stringBPower : 0);
  let currentSrc = 'Гілка А + Б';

  // No BMS on BLE right now: fall back to what the inverter sees on the 24V bus
  if (!anyActive && inv.data && inv.data.batV) {
    busVoltNum = inv.data.batV;
    busVoltSuffix = ' інв.';
    if (inv.data.batA !== null) {
      anyActive = true;
      totalCurrent = inv.data.batA;
      totalPower = inv.data.batV * inv.data.batA;
      currentSrc = 'за інвертором';
    }
  }

  let flowClass = '';
  let flowText = 'Режим очікування';
  if (anyActive) {
    if (totalCurrent > 0.08) {
      flowClass = 'charging';
      flowText = `⚡ Зарядка +${Math.round(totalPower)} W • ${totalCurrent.toFixed(1)} A`;
    } else if (totalCurrent < -0.08) {
      flowClass = 'discharging';
      flowText = `🔋 Розряд ${Math.round(Math.abs(totalPower))} W • ${Math.abs(totalCurrent).toFixed(1)} A`;
    } else {
      flowText = 'Спокій';
    }
  }

  // Usable Remaining Ah & kWh on the 24V Bus
  let remAhA = 0;
  if (stringAComplete) {
    remAhA = Math.min(getEffectiveRemAh(sandi.data), getEffectiveRemAh(sjy.data));
  } else if (vSandi > 0) {
    remAhA = getEffectiveRemAh(sandi.data);
  } else if (vSjy > 0) {
    remAhA = getEffectiveRemAh(sjy.data);
  }

  let remAhB = 0;
  if (stringBUse) {
    remAhB = Math.min(getEffectiveRemAh(hs1.data), getEffectiveRemAh(hs2.data));
  }

  // If remAh still zero but we have SOC, estimate from SOC × 100Ah per string
  if (remAhA === 0 && (sandi || sjy)) {
    const socA = sandi ? (sandi.data.soc || 0) : (sjy ? (sjy.data.soc || 0) : 0);
    remAhA = socA; // soc% × 100Ah nominal / 100 ≈ socA Ah
  }

  const totalRemAh = remAhA + remAhB;
  const totalNomAh = (vSandi || vSjy ? 100 : 0) + (stringBUse ? 100 : 0) || 100;
  const totalKwh = totalRemAh > 0 ? (totalRemAh * 25.6 / 1000) : 2.56;
  const cutSoc = etaParams().offSoc;
  const usableKwh = Math.max(0, (totalRemAh > 0 ? totalRemAh : 100) - cutSoc / 100 * totalNomAh) * 25.6 / 1000;

  // System-wide remaining time (see computeSystemEta)
  const etaStrings = [];
  const strOf = (x, y) => {
    const rx = getEffectiveRemAh(x.data), ry = y ? getEffectiveRemAh(y.data) : rx;
    const nom = Math.min(x.data.nomCap || 100, y ? (y.data.nomCap || 100) : 100);
    return { nom, remMin: Math.min(rx, ry), remMax: Math.max(rx, ry) };
  };
  if (stringAComplete) etaStrings.push(strOf(sandi, sjy));
  else if (vSandi > 0) etaStrings.push(strOf(sandi));
  else if (vSjy > 0) etaStrings.push(strOf(sjy));
  if (stringBUse) etaStrings.push(strOf(hs1, hs2));
  if (!etaStrings.length && inv.data && inv.data.batSoc !== null && inv.data.batSoc !== undefined) {
    etaStrings.push({ nom: 100, remMin: inv.data.batSoc, remMax: inv.data.batSoc });  // inverter SOC fallback
  }
  if (stringAComplete && sandi.data.current !== undefined) etaLearnR(stringAVolt, stringACurrent);
  const eta = anyActive || etaStrings.length
    ? computeSystemEta(etaStrings, totalCurrent, busVoltNum)
    : { cls: '', label: '⏱ Час роботи при поточному навантаженні:', value: '—', sub: '' };
  const sysEtaCls = eta.cls, sysEtaLabel = eta.label, sysEtaValue = eta.value, sysEtaSub = eta.sub;

  const hs = document.getElementById('header-sub');
  if (hs) hs.textContent = stringBActive ? 'Домашня система 24V • 2 гілки, 200Ah' : 'Домашня система 24V • 100Ah';

  panel.innerHTML = `
    <!-- INVERTER 24V MAIN BUS -->
    <div class="inverter-hero">
      <div class="inv-top">
        <div>
          <div class="inv-title">🔌 Інвертор • Шина 24V</div>
        </div>
        <span class="topo-mode-badge ${stringBActive ? 'full' : ''}">
          ${stringBActive ? '24V 200Ah' : '24V 100Ah'}
        </span>
      </div>

      <div class="inv-main-row">
        <div class="inv-big-v">
          ${busVoltNum !== null ? busVoltNum.toFixed(2) : '—'}
          <span class="unit">V${busVoltSuffix}</span>
        </div>
        <div class="inv-power-pill ${flowClass}">${flowText}</div>
      </div>

      ${renderInverterBlock(bmsBusV, `
      <div class="flow-item">
        <div class="bus-label">🔋 Запас</div>
        <div class="bus-val">${usableKwh.toFixed(2)} кВт·год</div>
        <div class="bus-sub">до відсічки ${cutSoc}%</div>
      </div>`)}

      <div class="inv-eta-banner ${sysEtaCls}">
        <span>${sysEtaLabel}${sysEtaSub ? `<span class="eta-sub">${sysEtaSub}</span>` : ''}</span>
        <span class="inv-eta-val">${sysEtaValue}</span>
      </div>

      ${invMoreHtml}
    </div>

    <!-- PARALLEL STRINGS A & B -->
    <div class="strings-wrap">
      ${renderStringCard({
        icon: '⚡', title: 'Гілка А · Sandisolar + SJY', sub: '2 × 12V послідовно = 24V 100Ah',
        state: 'on', volt: (vSandi || vSjy) ? stringAVolt : 0,
        slots: renderVisualBatterySlot(sandi, 'Sandisolar', '1/2', 'HL12100 • 12V 100Ah', 'sandisolar', false)
             + renderVisualBatterySlot(sjy, 'SJY', '2/2', 'DP04S007 • 12V 100Ah', 'sjy', false),
        balCls: balACls, balIcon: '⚖️', balLabel: 'Балансир', balText: balAText
      })}
      ${renderStringCard({
        icon: '🔋', title: 'Гілка Б · Humsienk', sub: '2 × 12V послідовно = 24V 100Ah',
        state: stringBState, manualSel: strB.manual || '', volt: stringBComplete ? stringBVolt : 0,
        slots: renderVisualBatterySlot(hs1, 'Humsienk 1', '1/2', 'Humsienk • 12V 100Ah', 'humsienk', false)
             + renderVisualBatterySlot(hs2, 'Humsienk 2', '2/2', 'Humsienk • 12V 100Ah', 'humsienk', false),
        balCls: balBCls, balIcon: stringBActive ? '⚖️' : '🔗', balLabel: stringBActive ? 'Балансир' : 'Між АКБ', balText: balBText,
        hint: strBHint
      })}
    </div>
  `;
}

const INV_BASE = 'https://web.dessmonitor.com/public/';
const INV_COMPANY = 'bnrl_frRFjEz8Mkn';
const INV_SETTING_IDS = [
  'bat_maximum_charging_voltage', 'bat_floating_charge_voltage',

];

            uploadEvery: 310000, lastGtsRaw: 0, nextAt: 0 };

async function sha1hex(str) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function invAuth(usr, pwdSha1) {
  const act = `&action=authSource&usr=${encodeURIComponent(usr)}&company-key=${INV_COMPANY}` +
    `&i18n=en_US&lang=en_US&source=1&_app_client_=android&_app_id_=wifiapp.volfw.smartess&_app_version_=1.0`;
  const salt = String(Date.now());
  const sign = await sha1hex(salt + pwdSha1 + act);
  const r = await (await fetch(`${INV_BASE}?sign=${sign}&salt=${salt}${act}`)).json();
  if (r.err !== 0) throw new Error(r.err === 261 ? 'Користувача не знайдено' : invErrUa(r.desc || ('err ' + r.err)));
  return { token: r.dat.token, secret: r.dat.secret, expiresAt: Date.now() + (r.dat.expire || 3600) * 1000 - 600000 };
}

async function invCall(act, retry = true) {
  if (!inv.cfg.token || Date.now() > (inv.cfg.expiresAt || 0)) {
    Object.assign(inv.cfg, await invAuth(inv.cfg.usr, inv.cfg.pwdSha1));
    invSave();
  }
  const salt = String(Date.now());
  const sign = await sha1hex(salt + inv.cfg.secret + inv.cfg.token + act);
  const r = await (await fetch(`${INV_BASE}?sign=${sign}&salt=${salt}&token=${inv.cfg.token}${act}`)).json();
  if (r.err !== 0 && retry && /TOKEN|SIGN|EXPIRE/i.test(r.desc || '')) {
    inv.cfg.token = null;
    return invCall(act, false);
  }
  if (r.err !== 0) throw new Error(invErrUa(r.desc || ('err ' + r.err)));
  return r.dat;
}

function invDevQuery() {
  const d = inv.cfg.dev;
  return `&pn=${d.pn}&devcode=${d.devcode}&devaddr=${d.devaddr}&sn=${encodeURIComponent(d.sn)}&i18n=en_US`;
}

async function invPickDevice(pnHint) {
  const dat = await invCall('&action=webQueryDeviceEs&page=0&pagesize=50&i18n=en_US');
  const list = (dat && dat.device) || [];
  if (!list.length) throw new Error('У акаунті SmartESS немає пристроїв');
  const dev = list.find(x => pnHint && (x.pn === pnHint || x.devalias === pnHint)) || list[0];
  inv.cfg.dev = { pn: dev.pn, sn: dev.sn, devcode: dev.devcode, devaddr: dev.devaddr, alias: dev.devalias || dev.pn };
  invSave();
}

// Cloud timestamps carry the server's timezone shift (whole hours): strip it.
function invFixTs(ts) {
  const offH = Math.round((Date.now() - ts) / 3600000);
  return offH !== 0 ? ts + offH * 3600000 : ts;
}

const INV_MODE_UA = {
  'grid mode': 'Від мережі', 'line mode': 'Від мережі', 'mains mode': 'Від мережі', 'battery mode': 'Від батареї',
  'standby mode': 'Очікування', 'power on mode': 'Увімкнення', 'fault mode': 'Аварія',
  'power saving mode': 'Енергозбереження', 'bypass mode': 'Байпас', 'off-grid mode': 'Автономно',
  'shutdown mode': 'Вимкнено', 'charging mode': 'Заряджання'
};
const INV_PRIO_UA = {
  SNU: 'Сонце + мережа', SOF: 'Спершу сонце', OSO: 'Тільки сонце', CSO: 'Пріоритет сонця', UTI: 'Мережа',
  SUB: 'Сонце → мережа → АКБ', SBU: 'Сонце → АКБ → мережа', USB: 'Мережа → сонце → АКБ', SUF: 'Сонце + мережа'
};
const INV_ERR_UA = {
  ERR_NOT_FOUND_USR: 'Користувача не знайдено', ERR_USR_OR_PWD: 'Неправильний логін або пароль',
  ERR_PASSWORD: 'Неправильний пароль', ERR_FORBIDDEN: 'Доступ заборонено', ERR_SIGN: 'Помилка підпису запиту',
  ERR_TOKEN_EXPIRED: 'Сесія завершилась', ERR_NO_RECORD: 'Немає даних'
};
function invModeUa(m) { return m ? (INV_MODE_UA[String(m).toLowerCase()] || m) : m; }
function invPrioUa(v) { return v && INV_PRIO_UA[v] ? `${INV_PRIO_UA[v]} (${v})` : (v === '--' || v === 'N/A' ? '—' : v); }
function invErrUa(desc) {
  if (!desc) return 'Помилка хмари';
  const key = Object.keys(INV_ERR_UA).find(k => desc.startsWith(k));
  if (key) return INV_ERR_UA[key];
  if (/failed to fetch|network|load failed/i.test(desc)) return 'Немає звʼязку з хмарою SmartESS';
  return 'Помилка хмари: ' + desc;
}
const invNum = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };

// queryDeviceLastData returns [{title, val, unit}] with human-readable titles. Titles stay the same when
// the cloud switches the device profile (devcode), unlike the per-profile ids of querySPDeviceLastData.
const invKey = t => String(t || '').replace(/\s+/g, ' ').trim().toLowerCase();
const INV_TITLE_SETTINGS = {
  bat_maximum_charging_voltage: ['maximum charging voltage', 'bulk charging voltage'],
  bat_floating_charge_voltage: ['floating charge voltage', 'floating charging voltage'],
  bat_constant_pressure_floating_charge_waiting_time: ['constant pressure to float waiting time', 'time from c.v to floating charge(min)'],
  bat_maximum_charging_current: ['maximum charging current'],
  bat_ac_maximum_charging_current: ['maximum mains charging current', 'maximum utility charging current'],
  bat_main_charging_priority: ['charger source priority', 'main charging priority'],
  bat_lithium_low_soc_protection_point: ['soc protection value of op1 in off-grid mode', 'low dc cut-off soc in off-grid mode'],
  bat_mains_mode_lithium_soc_protection_point: ['low dc protection soc in ac mode', 'low dc protection soc in mains mode'],
  bat_low_voltage_battery_protection_point: ['off-grid mode battery low voltage protection point', 'low dc protection voltage in off-grid mode'],
  bat_low_voltage_point_of_battery_in_mains_mode: ['mains mode battery low voltage protection point', 'low dc protection voltage in mains mode'],
};
const INV_TITLE_UA = {
  'operating mode': 'Режим роботи', 'grid voltage': 'Напруга мережі', 'grid frequency': 'Частота мережі',
  'grid power': 'Потужність з мережі', 'ac charging power': 'Заряд від мережі',
  'total output current': 'Вихідний струм', 'total output active power': 'Активна потужність навантаження',
  'total output aparent power': 'Повна потужність навантаження', 'total load percentage': 'Завантаження',
  'output l1 voltage': 'Вихідна напруга', 'output frequency': 'Вихідна частота',

  'pv temperature': 'Температура сонячного модуля', 'output priority': 'Пріоритет виходу',
};
const INV_RAW_SKIP = /^(id|timestamp|equipment type|protocol number|devise serial number|output l2 |load l[12] |output l1 (current|active|aparent))/;

async function invFetchLast(allowRepick = true) {
  try {
    const dat = await invCall('&action=queryDeviceLastData' + invDevQuery());
    if (!Array.isArray(dat) || !dat.length) throw new Error('ERR_NO_RECORD');
    return dat;
  } catch (e) {
    // The cloud sometimes re-registers the logger under a new devcode: pick the device again and retry once
    if (!allowRepick) throw e;
    const old = JSON.stringify(inv.cfg.dev);
    await invPickDevice(inv.cfg.dev && inv.cfg.dev.pn);
    if (JSON.stringify(inv.cfg.dev) === old) throw e;
    return invFetchLast(false);
  }
}

async function invPoll(force = false) {
  if (!inv.cfg || !inv.cfg.dev || inv.busy) return;
  if (!force && Date.now() - inv.lastPoll < 9000) return;
  inv.busy = true;
  try {
    const dat = await invFetchLast();
    const p = {}, raw = [];
    let measuring = true;
    for (const it of dat) {
      const k = invKey(it.title);
      if (!(k in p)) p[k] = it.val;
      if (k === 'output mode') measuring = false;          // after this the list holds settings, not readings
      if (measuring && !INV_RAW_SKIP.test(k)) {
        const v = k === 'operating mode' ? invModeUa(it.val) : /priority/.test(k) ? invPrioUa(it.val) : it.val;
        raw.push([INV_TITLE_UA[k] || it.title, v, (it.unit || '').replace(String.fromCharCode(0xFFFD), '°').replace(/^HZ$/i, 'Hz')]);
      }
    }
    // Upload period: learn it from consecutive timestamps (cloud time is local; invFixTs strips any whole-hour shift)
    const tsRaw = p['timestamp'] ? new Date(String(p['timestamp']).replace(' ', 'T')).getTime() : 0;
    if (tsRaw && tsRaw !== inv.lastGtsRaw) {
      if (inv.lastGtsRaw) {
        const iv = tsRaw - inv.lastGtsRaw;
        if (iv > 5000 && iv < 900000) inv.uploadEvery = Math.round(inv.uploadEvery * 0.5 + iv * 0.5);
      }
      inv.lastGtsRaw = tsRaw;
    }
    const modeRaw = p['operating mode'] || '';
    const onBattery = /battery|off-grid|inverter/i.test(modeRaw);
    // Battery current may come unsigned in some profiles: derive the sign (+ charge, - discharge)
    let batA = invNum(p['battery current']);
    const batP = invNum(p['battery power']);
    const chgP = (invNum(p['ac charging power']) || 0) + (invNum(p['pv charging power']) || 0);
    if (batA !== null && batA > 0) {
      if ((batP !== null && batP < 0) || (onBattery && chgP <= 0)) batA = -batA;
    }
    inv.data = {
      ts: invFixTs(tsRaw || Date.now()),
      mode: invModeUa(modeRaw),
      gridV: invNum(p['grid voltage']), gridHz: invNum(p['grid frequency']),
      pvV: invNum(p['pv voltage']), pvW: invNum(p['pv power']),
      batV: invNum(p['battery voltage']), batA, batSoc: invNum(p['battery soc'] ?? p['battery capacity']),
      loadW: invNum(p['total output active power'] ?? p['output active power']),
      loadVA: invNum(p['total output aparent power'] ?? p['output apparent power']),
      loadPct: invNum(p['total load percentage'] ?? p['load percent']),
      tInv: invNum(p['inv module termperature']),
      raw
    };
    // Settings come in the same response now: map them to the ids the rest of the app uses
    const st = {};
    for (const [id, titles] of Object.entries(INV_TITLE_SETTINGS)) {
      const t = titles.find(x => x in p);
      if (t && p[t] !== '' && p[t] != null) st[id] = String(p[t]);
    }
    if (Object.keys(st).length >= 5) { inv.settings = st; inv.lastSettings = Date.now(); }
    else if (force || Date.now() - inv.lastSettings > 3600000) await invReadSettings();
    inv.error = null;
    inv.lastPoll = Date.now();
    inv.nextAt = inv.data.ts + inv.uploadEvery;
    try { localStorage.setItem(INV_KEY + '_cache', JSON.stringify({ data: inv.data, settings: inv.settings, lastSettings: inv.lastSettings })); } catch (e) {}
  } catch (e) {
    inv.error = invErrUa(e.message || String(e));
    inv.lastPoll = Date.now();
  } finally {
    inv.busy = false;
    renderCards();
  }
}

async function invReadSettings() {
  const s = {};
  for (const id of INV_SETTING_IDS) {
    try {
      const d = await invCall(`&action=queryDeviceCtrlValue&id=${id}` + invDevQuery());
      s[id] = d.val;
    } catch (e) {}
  }
  inv.settings = s;
  inv.lastSettings = Date.now();
}

// ===== History log (Δ, balancer, current, cells) persisted in localStorage =====
const HIST_KEY = 'bms_studio_hist_v1';
const HIST_MAX = 4000;       // ~6-10 hours of active 5s logging
let histStore = {};
try { histStore = JSON.parse(localStorage.getItem(HIST_KEY) || '{}') || {}; } catch (e) { histStore = {}; }

function histKey(s) { return s.brand + '|' + (s.name || ''); }

function recordHistory() {
  const now = Date.now();
  let changed = false;
  for (const s of Object.values(sessions)) {
    if (!s.connected || !s.data || !s.data.cells || s.data.cells.length === 0) continue;
    const k = histKey(s);
    const arr = histStore[k] || (histStore[k] = []);
    const cur = s.data.current || 0;

    // Fast sampling: every 5s during active discharge (cur < -0.2A) or charge (cur > 0.2A)
    // Slower sampling: every 20s when idle
    const isUnderLoad = Math.abs(cur) >= 0.2;
    const reqInterval = isUnderLoad ? 5000 : 20000;
    if (arr.length && now - arr[arr.length - 1][0] < reqInterval - 600) continue;

    const c = s.data.cells;
    const minVal = Math.min(...c);
    const maxVal = Math.max(...c);
    const minIdx = c.indexOf(minVal);
    const maxIdx = c.indexOf(maxVal);
    const delta = Math.round((maxVal - minVal) * 1000);
    const cellsCopy = c.map(v => +v.toFixed(3));

    // Format: [ts, V, I, delta_mV, balActive, maxV, minV, minCellNum(1-based), maxCellNum(1-based), cellsCopy]
    arr.push([
      now,
      +(s.data.voltage || 0).toFixed(2),
      +cur.toFixed(2),
      delta,
      s.data.balMask ? 1 : 0,
      +maxVal.toFixed(3),
      +minVal.toFixed(3),
      minIdx + 1,
      maxIdx + 1,
      cellsCopy
    ]);
    if (arr.length > HIST_MAX) arr.splice(0, arr.length - HIST_MAX);
    changed = true;
  }
  if (changed) {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(histStore)); } catch (e) {}
  }
}

function copyHistory(id) {
  const s = sessions[id];
  if (!s) return;
  const arr = histStore[histKey(s)] || [];
  const maxCells = arr.reduce((m, r) => Math.max(m, (r[9] && r[9].length) || 0), 4);
  const cellHeaders = Array.from({length: maxCells}, (_, i) => `c${i+1}`).join(',');
  const header = `time,V,I,delta_mV,balancing,maxCell,minCell,minCellNum,maxCellNum,${cellHeaders}\n`;
  const rows = arr.map(r => {
    const cellsPart = (r[9] && r[9].length)
      ? r[9].join(',')
      : (r[6] !== undefined && r[5] !== undefined ? `${r[6]},${r[5]}` : '');
    return [
      new Date(r[0]).toISOString(),
      r[1],
      r[2],
      r[3],
      r[4],
      r[5],
      r[6],
      r[7] || '',
      r[8] || '',
      cellsPart
    ].join(',');
  }).join('\n');
  const csv = header + rows;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(csv).then(() => alert('Скопійовано ' + arr.length + ' рядків CSV з напругами всіх комірок'),
      () => prompt('Скопіюйте вручну:', csv.slice(-4000)));
  } else {
    prompt('Скопіюйте вручну:', csv.slice(-4000));
  }
}

// Display units in Ukrainian: only number+unit tokens in rendered text are touched,
// so code/ids/protocol stay as they are.
const UA_UNITS = { 'kWh': 'кВт·год', 'mV': 'мВ', 'VA': 'ВА', 'Ah': 'Аг', 'Hz': 'Гц', 'HZ': 'Гц', 'V': 'В', 'A': 'А', 'W': 'Вт', 'S': 'S' };
const UA_UNIT_RE = /(\d|—|\))(\s?)(kWh|mV|VA|Ah|Hz|HZ|V|A|W)(?![A-Za-zА-Яа-яІіЇїЄєҐґ])/g;
function uaUnits(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) {
    if (n.parentElement && n.parentElement.closest('.no-ua')) continue;
    const t = n.nodeValue;
    if (!/[0-9—)]\s?(kWh|mV|VA|Ah|Hz|HZ|V|A|W)/.test(t)) continue;
    n.nodeValue = t.replace(UA_UNIT_RE, (m, a, sp, u) => a + sp + UA_UNITS[u]);
  }
  // unit-only spans like <span class="unit">V</span>
  root.querySelectorAll('.unit').forEach(el => {
    const u = el.textContent.trim().split(/\s+/)[0];
    if (UA_UNITS[u]) el.textContent = el.textContent.replace(u, UA_UNITS[u]);
  });
}
