<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BMS Studio</title>
  <style>
    :root {
      --bg: #060913;
      --card: rgba(18, 25, 43, 0.78);
      --card-inner: rgba(10, 15, 29, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
      --muted: #8b9bb4;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.22);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.22);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.22);
      --rose: #f43f5e;
      --rose-glow: rgba(244, 63, 94, 0.22);
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      margin: 0;
      padding: 16px 14px 44px;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(16, 185, 129, 0.14), transparent 45%),
        radial-gradient(circle at 85% 5%, rgba(59, 130, 246, 0.14), transparent 45%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 2px 2px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 182, 212, 0.15));
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.18);
    }

    .header h1 {
      font-size: 21px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.4px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .live-badge {
      font-size: 11px;
      font-weight: 600;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* Quick Connect Dock */
    .connect-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .connect-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(16px);
      color: var(--text);
      padding: 11px 6px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      overflow: hidden;
      transition: transform 0.14s ease, border-color 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .connect-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .connect-btn:active {
      transform: scale(0.95);
    }

    .connect-btn.connected {
      border-color: rgba(16, 185, 129, 0.45);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.16) 0%, rgba(18, 25, 43, 0.85) 100%);
    }

    .connect-btn .sub {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Summary Banner when multiple batteries connected */
    .summary-bar {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(59, 130, 246, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(16px);
    }

    .summary-item {
      text-align: center;
    }

    .summary-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }

    .summary-val {
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Cards Container */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      background: var(--card);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 38px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      backdrop-filter: blur(16px);
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 10px;
      opacity: 0.85;
    }

    /* Battery Card */
    .card {
      background: var(--card);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-highlight);
      border-radius: 24px;
      padding: 18px;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .short-id {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
    }

    .dot.off {
      background: var(--rose);
      box-shadow: 0 0 8px var(--rose);
    }

    .dev-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      padding-left: 17px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card-inner);
      color: var(--muted);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, color 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      color: var(--text);
    }

    /* Hero SOC + Energy Block */
    .soc-panel {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .soc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .soc-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .soc-val {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .flow-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .flow-pill.charging {
      background: var(--emerald-glow);
      color: #34d399;
    }

    .flow-pill.discharging {
      background: var(--amber-glow);
      color: #fbbf24;
    }

    .soc-right {
      text-align: right;
    }

    .soc-cap {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .soc-eta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .progress-track {
      height: 12px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      padding: 2px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #059669 0%, #10b981 55%, #34d399 100%);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.45);
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .progress-fill.charging::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-fill.warn {
      background: linear-gradient(90deg, #d97706, #f59e0b);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    .progress-fill.low {
      background: linear-gradient(90deg, #e11d48, #f43f5e);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }

    /* Hero Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 11px 8px;
      text-align: center;
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .metric-num {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .metric-num .unit {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    /* Status Switches Row */
    .switches-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .switch-pill {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .switch-pill .state {
      font-weight: 800;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .switch-pill.on .state {
      background: var(--emerald-glow);
      color: #34d399;
    }

    .switch-pill.off .state {
      background: var(--rose-glow);
      color: #fb7185;
    }

    .switch-pill.bal-on {
      border-color: rgba(6, 182, 212, 0.45);
      background: rgba(6, 182, 212, 0.1);
      color: #e2e8f0;
    }

    .switch-pill.bal-on .state {
      background: var(--cyan-glow);
      color: #22d3ee;
    }

    /* Cells Section */
    .cells-panel {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .cells-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cells-title {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .delta-badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .delta-badge.good { background: var(--emerald-glow); color: #34d399; }
    .delta-badge.mid  { background: var(--amber-glow); color: #fbbf24; }
    .delta-badge.high { background: var(--rose-glow); color: #fb7185; }

    .cells-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .cell-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 13px;
      padding: 9px 11px;
      transition: border-color 0.2s ease;
    }

    .cell-item.is-min {
      border-color: rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.06);
    }

    .cell-item.is-max {
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.06);
    }

    .cell-item.is-bal {
      border-color: rgba(6, 182, 212, 0.65);
      background: rgba(6, 182, 212, 0.12);
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.15);
    }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .cell-idx {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .cell-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 5px;
      letter-spacing: 0.3px;
    }

    .cell-tag.min { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .cell-tag.max { background: var(--amber-glow); color: #fbbf24; }
    .cell-tag.bal { background: var(--cyan-glow); color: #22d3ee; }

    .cell-volt {
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .cell-bar {
      height: 5px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .cell-bar-fill {
      height: 100%;
      background: #64748b;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .cell-item.is-min .cell-bar-fill { background: #3b82f6; }
    .cell-item.is-max .cell-bar-fill { background: #f59e0b; }
    .cell-item.is-bal .cell-bar-fill { background: #06b6d4; }

    /* Footer */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 0;
      font-size: 12px;
      color: var(--muted);
    }

    .footer-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-chip b {
      color: #e2e8f0;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .err-banner {
      background: var(--rose-glow);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title-wrap">
      <div class="app-icon">⚡</div>
      <div>
        <h1>BMS Studio</h1>
        <div class="header-sub">LiFePO4 Bluetooth Телеметрія</div>
      </div>
    </div>
    <div class="live-badge">
      <span class="pulse-dot"></span>
      <span>LIVE 2с</span>
    </div>
  </div>

  <div class="connect-bar">
    <button id="btn-sandisolar" class="connect-btn" onclick="connectBattery('sandisolar')">
      <span>Sandisolar</span>
      <span class="sub">HL12100</span>
    </button>
    <button id="btn-humsienk" class="connect-btn" onclick="connectBattery('humsienk')">
      <span>Humsienk</span>
      <span class="sub">HS0302</span>
    </button>
    <button id="btn-sjy" class="connect-btn" onclick="connectBattery('sjy')">
      <span>SJY</span>
      <span class="sub">DP04</span>
    </button>
    <button class="connect-btn" onclick="connectBattery('all')">
      <span>Всі BLE</span>
      <span class="sub">Пошук</span>
    </button>
  </div>

  <div id="summary-bar" class="summary-bar">
    <div class="summary-item">
      <div class="summary-label">Напруга збірки</div>
      <div id="sum-volt" class="summary-val">—</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Загальна потужність</div>
      <div id="sum-power" class="summary-val">—</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Підключено</div>
      <div id="sum-count" class="summary-val">0 АКБ</div>
    </div>
  </div>

  <div id="cards" class="cards"></div>
</div>

<script>
const UUID_SVC_HL  = '0000fffa-0000-1000-8000-00805f9b34fb';
const UUID_TX_HL   = '0000fffb-0000-1000-8000-00805f9b34fb';
const UUID_RX_HL   = '0000fffc-0000-1000-8000-00805f9b34fb';

const UUID_SVC_HS  = '00000001-0000-1000-8000-00805f9b34fb';
const UUID_TX_HS   = '00000002-0000-1000-8000-00805f9b34fb';
const UUID_RX_HS   = '00000003-0000-1000-8000-00805f9b34fb';

const UUID_SVC_JBD = '0000ff00-0000-1000-8000-00805f9b34fb';
const UUID_RX_JBD  = '0000ff01-0000-1000-8000-00805f9b34fb';
const UUID_TX_JBD  = '0000ff02-0000-1000-8000-00805f9b34fb';

const OPTIONAL_SERVICES = [
  UUID_SVC_HL,
  UUID_SVC_HS,
  UUID_SVC_JBD,
  '00001800-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb',
  '11110001-1111-1111-1111-111111111111'
];

const sessions = {};

function hexToBytes(hex) {
  const arr = new Uint8Array(hex.length / 2);
  for (let i = 0; i < arr.length; i++) {
    arr[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return arr;
}

function readInt(u8, offset, size, littleEndian = false, signed = false) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  if (size === 1) return signed ? dv.getInt8(offset) : dv.getUint8(offset);
  if (size === 2) return signed ? dv.getInt16(offset, littleEndian) : dv.getUint16(offset, littleEndian);
  if (size === 3) {
    let val = littleEndian
      ? (u8[offset] | (u8[offset + 1] << 8) | (u8[offset + 2] << 16))
      : ((u8[offset] << 16) | (u8[offset + 1] << 8) | u8[offset + 2]);
    if (signed && (val & 0x800000)) val -= 0x1000000;
    return val;
  }
  if (size === 4) return signed ? dv.getInt32(offset, littleEndian) : dv.getUint32(offset, littleEndian);
  return 0;
}

async function writeChar(char, data) {
  if (char.properties && char.properties.writeWithoutResponse) {
    try {
      await char.writeValueWithoutResponse(data);
      return;
    } catch (e) {}
  }
  if (char.properties && char.properties.write) {
    await char.writeValueWithResponse(data);
    return;
  }
  await char.writeValue(data);
}

async function connectBattery(mode) {
  try {
    let options;
    if (mode === 'sandisolar') {
      options = {
        filters: [{ namePrefix: 'HL' }, { namePrefix: 'SH' }, { services: [UUID_SVC_HL] }],
        optionalServices: OPTIONAL_SERVICES
      };
    } else if (mode === 'humsienk') {
      options = {
        filters: [
          { namePrefix: 'HS' },
          { namePrefix: 'HUM' },
          { namePrefix: 'ECO' },
          { namePrefix: 'DCH' },
          { services: [UUID_SVC_HS] },
          { services: [UUID_SVC_JBD] }
        ],
        optionalServices: OPTIONAL_SERVICES
      };
    } else if (mode === 'sjy') {
      options = {
        filters: [{ namePrefix: 'DP04' }, { namePrefix: 'JBD' }, { namePrefix: 'SJY' }, { services: [UUID_SVC_JBD] }],
        optionalServices: OPTIONAL_SERVICES
      };
    } else {
      options = {
        acceptAllDevices: true,
        optionalServices: OPTIONAL_SERVICES
      };
    }

    const device = await navigator.bluetooth.requestDevice(options);
    await setupDeviceSession(device);
  } catch (err) {}
}

function detectBrandByName(name) {
  const up = (name || '').toUpperCase();
  if (up.startsWith('HL') || up.startsWith('SH')) return 'Sandisolar';
  if (up.startsWith('HS')) return 'Humsienk';
  if (up.startsWith('DP04') || up.startsWith('JBD') || up.startsWith('SJY')) return 'SJY';
  return 'Акумулятор';
}

async function setupDeviceSession(device) {
  if (sessions[device.id] && sessions[device.id].timer) {
    clearInterval(sessions[device.id].timer);
  }

  const session = {
    id: device.id,
    device: device,
    name: device.name || 'BLE BMS',
    brand: detectBrandByName(device.name || ''),
    type: null,
    server: null,
    txChar: null,
    rxChar: null,
    connected: false,
    lastUpdate: null,
    error: null,
    data: {},
    rxBuf: new Uint8Array(0),
    hsFrames: {},
    polling: false,
    timer: null
  };

  sessions[device.id] = session;
  renderCards();

  device.addEventListener('gattserverdisconnected', () => {
    session.connected = false;
    session.polling = false;
    renderCards();
    if (!session.manualClose) {
      setTimeout(() => {
        if (sessions[session.id] && !session.connected && !session.reconnecting) {
          connectAndInit(session);
        }
      }, 1500);
    }
  });

  await connectAndInit(session);
}

async function connectAndInit(session) {
  if (session.reconnecting) return;
  session.reconnecting = true;
  try {
    session.error = null;
    session.polling = false;
    renderCards();

    session.server = await session.device.gatt.connect();
    session.connected = true;

    const services = await session.server.getPrimaryServices();
    const svcUuids = services.map(s => s.uuid.toLowerCase());
    const up = (session.name || '').toUpperCase();

    if (svcUuids.some(u => u.includes('fffa')) || up.startsWith('HL')) {
      session.type = 'saihang';
      session.brand = 'Sandisolar';
      const svc = await session.server.getPrimaryService(UUID_SVC_HL);
      session.txChar = await svc.getCharacteristic(UUID_TX_HL);
      session.rxChar = await svc.getCharacteristic(UUID_RX_HL);
    } else if ((svcUuids.some(u => u.startsWith('00000001')) && !up.startsWith('DP04')) || up.startsWith('HS')) {
      session.type = 'humsienk';
      session.brand = 'Humsienk';
      const svc = await session.server.getPrimaryService(UUID_SVC_HS);
      session.txChar = await svc.getCharacteristic(UUID_TX_HS);
      session.rxChar = await svc.getCharacteristic(UUID_RX_HS);
    } else if (svcUuids.some(u => u.includes('ff00')) || up.startsWith('DP04')) {
      session.type = 'jbd';
      session.brand = 'SJY';
      const svc = await session.server.getPrimaryService(UUID_SVC_JBD);
      session.txChar = await svc.getCharacteristic(UUID_TX_JBD);
      session.rxChar = await svc.getCharacteristic(UUID_RX_JBD);
    } else {
      throw new Error('Невідомий тип BMS');
    }

    await session.rxChar.startNotifications();
    session.rxChar.addEventListener('characteristicvaluechanged', (ev) => {
      const chunk = new Uint8Array(ev.target.value.buffer, ev.target.value.byteOffset, ev.target.value.byteLength);
      onRxData(session, chunk);
    });

    if (session.type === 'humsienk') {
      await writeChar(session.txChar, hexToBytes('aa00000000'));
      await new Promise(r => setTimeout(r, 250));
    }

    await pollSession(session);
    if (session.timer) clearInterval(session.timer);
    session.timer = setInterval(() => {
      if (session.connected) {
        pollSession(session);
      } else if (!session.manualClose && !session.reconnecting) {
        connectAndInit(session);
      }
    }, 2200);

  } catch (err) {
    session.error = err.message || String(err);
    renderCards();
  } finally {
    session.reconnecting = false;
  }
}

function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

function onRxData(session, chunk) {
  if (session.type === 'saihang') {
    if (chunk.length >= 2 && chunk[0] === 0xa5 && chunk[1] === 0xa5) {
      session.rxBuf = chunk;
    } else {
      session.rxBuf = concatBytes(session.rxBuf, chunk);
    }
    if (session.rxBuf.length >= 7 && session.rxBuf[0] === 0xa5 && session.rxBuf[1] === 0xa5) {
      const expectedLen = 7 + session.rxBuf[4];
      if (session.rxBuf.length >= expectedLen) {
        parseSaihang(session, session.rxBuf.slice(0, expectedLen));
        session.rxBuf = new Uint8Array(0);
      }
    }
  } else if (session.type === 'humsienk') {
    if (chunk.length >= 5 && chunk[0] === 0xaa) {
      session.hsFrames[chunk[1]] = chunk;
      parseHumsienk(session);
    }
  } else if (session.type === 'jbd') {
    if (chunk.length >= 4 && chunk[0] === 0xdd && (chunk[1] === 0x03 || chunk[1] === 0x04 || chunk[1] === 0x05)) {
      session.rxBuf = chunk;
    } else {
      session.rxBuf = concatBytes(session.rxBuf, chunk);
    }
    if (session.rxBuf.length >= 7 && session.rxBuf[0] === 0xdd) {
      const expectedLen = 7 + session.rxBuf[3];
      if (session.rxBuf.length >= expectedLen && session.rxBuf[expectedLen - 1] === 0x77) {
        parseJbdFrame(session, session.rxBuf.slice(0, expectedLen));
        session.rxBuf = new Uint8Array(0);
      }
    }
  }
}

function parseSaihang(session, m) {
  const current = readInt(m, 5, 4, false, true) / 100.0;
  const voltage = readInt(m, 9, 4, false, false) / 100.0;
  const soc = readInt(m, 13, 2, false, false);
  const soh = readInt(m, 15, 2, false, false);
  const remCap = readInt(m, 17, 4, false, false) / 100.0;
  const nomCap = readInt(m, 25, 4, false, false) / 100.0;
  const cycles = readInt(m, 29, 2, false, false);
  const problemCode = (~readInt(m, 31, 2, false, false)) & 0xFFFF;
  const mosBits = readInt(m, 37, 2, false, false);
  const chgMos = Boolean(mosBits & 0x0200);
  const dsgMos = Boolean(mosBits & 0x0400);
  const balMask = readInt(m, 41, 2, false, false);
  const cellCount = Math.min(readInt(m, 43, 2, false, false), 20);

  const cells = [];
  for (let i = 0; i < cellCount; i++) {
    const pos = 45 + i * 2;
    if (pos + 2 <= m.length) {
      cells.push(readInt(m, pos, 2, false, false) / 1000.0);
    }
  }

  const tempSensors = Math.min(readInt(m, 85, 2, false, false), 10);
  const temps = [];
  for (let i = 0; i < tempSensors; i++) {
    const pos = 87 + i * 2;
    if (pos + 2 <= m.length) {
      const rawT = readInt(m, pos, 2, false, true);
      if (rawT !== 0) temps.push(((rawT - 2730) / 10.0).toFixed(1));
    }
  }

  session.data = {
    voltage, current, power: voltage * current,
    soc, soh, remCap, nomCap, cycles,
    chgMos, dsgMos, balMask, cells, temps, problemCode
  };
  session.lastUpdate = new Date();
  session.error = null;
  renderCards();
}

function parseHumsienk(session) {
  const m20 = session.hsFrames[0x20];
  const m21 = session.hsFrames[0x21];
  const m22 = session.hsFrames[0x22];
  const d = Object.assign({}, session.data);

  if (m21 && m21.length >= 25) {
    d.voltage = readInt(m21, 3, 4, true, false) / 1000.0;
    d.current = readInt(m21, 7, 4, true, true) / 1000.0;
    d.power = d.voltage * d.current;
    d.soc = readInt(m21, 11, 1, true, false);
    d.soh = readInt(m21, 12, 1, true, false);
    d.remCap = readInt(m21, 13, 4, true, false) / 1000.0;
    d.nomCap = readInt(m21, 17, 4, true, false) / 1000.0;
    d.cycles = readInt(m21, 21, 2, true, false);

    const temps = [];
    for (let i = 0; i < 4; i++) {
      if (23 + i < m21.length - 2) {
        const tv = readInt(m21, 23 + i, 1, true, true);
        if (tv !== 0) temps.push(tv.toFixed(0));
      }
    }
    d.temps = temps;
  }

  if (m20 && m20.length >= 16) {
    d.chgMos = Boolean(m20[7] & 0x80);
    d.dsgMos = Boolean(m20[9] & 0x80);
    d.balMask = readInt(m20, 11, 3, true, false);
    d.problemCode = (readInt(m20, 7, 4, true, false) & 0xFF7F7F7F) >>> 0;
  }

  if (m22 && m22.length >= 7) {
    const cells = [];
    for (let i = 0; i < 24; i++) {
      const pos = 3 + i * 2;
      if (pos + 2 <= m22.length - 2) {
        const cv = readInt(m22, pos, 2, true, false);
        if (cv > 0) cells.push(cv / 1000.0);
      }
    }
    d.cells = cells;
  }

  session.data = d;
  session.lastUpdate = new Date();
  session.error = null;
  renderCards();
}

function parseJbdFrame(session, f) {
  const cmd = f[1];
  const d = Object.assign({}, session.data);

  if (cmd === 0x03 && f.length >= 27) {
    const tempCount = f[26];
    const ctrlPos = 27 + 2 * tempCount;
    const isD10 = (ctrlPos < f.length - 3) && Boolean(f[ctrlPos] & 0x80);
    const scale = isD10 ? 10.0 : 100.0;

    d.voltage = readInt(f, 4, 2, false, false) / 100.0;
    d.current = readInt(f, 6, 2, false, true) / scale;
    d.power = d.voltage * d.current;
    d.remCap = readInt(f, 8, 2, false, false) / scale;
    d.nomCap = readInt(f, 10, 2, false, false) / scale;
    d.cycles = readInt(f, 12, 2, false, false);

    const balLow = readInt(f, 16, 2, false, false);
    const balHigh = readInt(f, 18, 2, false, false);
    d.balMask = ((balHigh << 16) | balLow) >>> 0;

    d.problemCode = readInt(f, 20, 2, false, false);
    d.soc = f[23];
    d.chgMos = Boolean(f[24] & 0x01);
    d.dsgMos = Boolean(f[24] & 0x02);

    const temps = [];
    for (let i = 0; i < tempCount; i++) {
      const pos = 27 + i * 2;
      if (pos + 2 <= f.length - 3) {
        const rawK = readInt(f, pos, 2, false, false);
        temps.push(((rawK - 2731) / 10.0).toFixed(1));
      }
    }
    d.temps = temps;
  } else if (cmd === 0x04) {
    const nCells = Math.floor((f.length - 7) / 2);
    const cells = [];
    for (let i = 0; i < nCells; i++) {
      const cv = readInt(f, 4 + i * 2, 2, false, false);
      if (cv > 0) cells.push(cv / 1000.0);
    }
    d.cells = cells;
  }

  session.data = d;
  session.lastUpdate = new Date();
  session.error = null;
  renderCards();
}

async function pollSession(session) {
  if (!session.connected) return;
  const now = Date.now();
  if (session.polling && session.pollStart && (now - session.pollStart < 4000)) return;
  session.polling = true;
  session.pollStart = now;
  try {
    if (session.type === 'saihang') {
      await writeChar(session.txChar, hexToBytes('a5a5000300000036c40d'));
    } else if (session.type === 'humsienk') {
      for (const hex of ['aa20002000', 'aa21002100', 'aa22002200']) {
        await writeChar(session.txChar, hexToBytes(hex));
        await new Promise(r => setTimeout(r, 180));
      }
    } else if (session.type === 'jbd') {
      await writeChar(session.txChar, hexToBytes('dda50300fffd77'));
      await new Promise(r => setTimeout(r, 240));
      await writeChar(session.txChar, hexToBytes('dda50400fffc77'));
    }
  } catch (err) {
  } finally {
    session.polling = false;
  }
}

async function manualReconnect(id) {
  const s = sessions[id];
  if (s) {
    s.manualClose = false;
    await connectAndInit(s);
  }
}

function disconnectDevice(id) {
  const s = sessions[id];
  if (!s) return;
  s.manualClose = true;
  if (s.timer) clearInterval(s.timer);
  try {
    if (s.device && s.device.gatt && s.device.gatt.connected) {
      s.device.gatt.disconnect();
    }
  } catch (e) {}
  delete sessions[id];
  renderCards();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    Object.values(sessions).forEach(s => {
      if (s.connected) pollSession(s);
      else if (!s.manualClose) connectAndInit(s);
    });
  }
});

function fmt(v, digits = 2) {
  return (v !== undefined && v !== null && !isNaN(v)) ? Number(v).toFixed(digits) : '—';
}

function formatEta(d) {
  const cur = d.current || 0;
  const rem = d.remCap;
  const nom = d.nomCap;
  if (!rem || Math.abs(cur) < 0.15) return 'Режим очікування';
  let hrs = 0;
  let prefix = '';
  if (cur < -0.15) {
    hrs = rem / Math.abs(cur);
    prefix = 'Вистачить на ~';
  } else if (cur > 0.15 && nom) {
    hrs = Math.max(0.05, (nom - rem) / cur);
    prefix = 'Повний через ~';
  } else {
    return '';
  }
  if (hrs > 48) return prefix + '> 48 год';
  const h = Math.floor(hrs);
  const m = Math.round((hrs - h) * 60);
  return `${prefix}${h > 0 ? h + ' год ' : ''}${m} хв`;
}

function updateTopHighlights(list) {
  const brands = new Set(list.filter(s => s.connected).map(s => s.brand.toLowerCase()));
  const map = { sandisolar: 'btn-sandisolar', humsienk: 'btn-humsienk', sjy: 'btn-sjy' };
  for (const [key, btnId] of Object.entries(map)) {
    const el = document.getElementById(btnId);
    if (el) el.classList.toggle('connected', brands.has(key));
  }

  const sumBar = document.getElementById('summary-bar');
  if (list.length >= 2) {
    sumBar.style.display = 'flex';
    const totalV = list.reduce((acc, s) => acc + (s.data.voltage || 0), 0);
    const totalP = list.reduce((acc, s) => acc + (s.data.power || 0), 0);
    document.getElementById('sum-volt').textContent = totalV.toFixed(2) + ' V';
    document.getElementById('sum-power').textContent = Math.round(totalP) + ' W';
    document.getElementById('sum-count').textContent = list.length + ' АКБ';
  } else {
    sumBar.style.display = 'none';
  }
}

function renderCards() {
  const container = document.getElementById('cards');
  const list = Object.values(sessions);
  updateTopHighlights(list);

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔋</div>
        <div style="font-weight:700; color:#e2e8f0; margin-bottom:4px;">Немає активних підключень</div>
        <div>Натисніть на кнопку акумулятора зверху, щоб підключитися по Bluetooth</div>
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(s => {
    const d = s.data || {};
    const cells = d.cells || [];
    let minV = null, maxV = null, deltaMv = null, minIdx = -1, maxIdx = -1;

    if (cells.length > 0) {
      minV = Math.min(...cells);
      maxV = Math.max(...cells);
      deltaMv = Math.round((maxV - minV) * 1000);
      minIdx = cells.indexOf(minV);
      maxIdx = cells.indexOf(maxV);
    }

    const soc = d.soc !== undefined ? d.soc : 0;
    const cur = d.current || 0;
    const isCharging = cur > 0.05;
    const isDischarging = cur < -0.05;

    const socClass = [
      soc < 20 ? 'low' : (soc < 45 ? 'warn' : ''),
      isCharging ? 'charging' : ''
    ].filter(Boolean).join(' ');

    const flowCls = isCharging ? 'charging' : (isDischarging ? 'discharging' : '');
    const flowText = isCharging ? '⚡ Заряджається' : (isDischarging ? '🔋 Розряд' : 'Спокій');

    const balActive = Boolean(d.balMask && d.balMask > 0);
    const deltaClass = deltaMv === null ? 'good' : (deltaMv <= 20 ? 'good' : (deltaMv <= 60 ? 'mid' : 'high'));

    const updatedStr = s.lastUpdate instanceof Date
      ? s.lastUpdate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : (s.lastUpdate || 'підключення...');

    const shortId = (s.name && s.name.length >= 4)
      ? '#' + s.name.replace(/[^A-Za-z0-9]/g, '').slice(-4)
      : '';

    const cellsHtml = cells.map((cv, idx) => {
      const isBal = Boolean(d.balMask && (d.balMask & (1 << idx)));
      const isMin = !isBal && idx === minIdx && deltaMv > 2;
      const isMax = !isBal && idx === maxIdx && deltaMv > 2;
      const itemCls = isBal ? 'is-bal' : (isMin ? 'is-min' : (isMax ? 'is-max' : ''));
      const tagHtml = isBal
        ? `<span class="cell-tag bal">⚖️ BAL</span>`
        : (isMin ? `<span class="cell-tag min">MIN</span>` : (isMax ? `<span class="cell-tag max">MAX</span>` : ''));

      const pct = Math.max(6, Math.min(100, ((cv - 3.0) / 0.65) * 100));

      return `
        <div class="cell-item ${itemCls}">
          <div class="cell-top">
            <span class="cell-idx">Комірка #${idx + 1}</span>
            ${tagHtml}
          </div>
          <div class="cell-volt">${cv.toFixed(3)} V</div>
          <div class="cell-bar">
            <div class="cell-bar-fill" style="width:${pct}%"></div>
          </div>
        </div>
      `;
    }).join('');

    const tempStr = (d.temps && d.temps.length > 0) ? `${d.temps[0]}°C` : '—';
    const etaStr = formatEta(d);

    return `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="brand-title">
              <span class="dot ${s.connected ? '' : 'off'}"></span>
              <span>${s.brand}</span>
              ${shortId ? `<span class="short-id">${shortId}</span>` : ''}
            </div>
            <div class="dev-sub">${s.name} • оновлено о ${updatedStr}</div>
          </div>
          <div class="card-actions">
            ${!s.connected
              ? `<button class="icon-btn" onclick="manualReconnect('${s.id}')" title="Перепідключити">↻</button>`
              : `<button class="icon-btn" onclick="pollSession(sessions['${s.id}'])" title="Оновити">↻</button>`
            }
            <button class="icon-btn" onclick="disconnectDevice('${s.id}')" title="Закрити">✕</button>
          </div>
        </div>

        ${s.error ? `<div class="err-banner">${s.error}</div>` : ''}

        <div class="soc-panel">
          <div class="soc-header">
            <div class="soc-left">
              <div class="soc-val">${d.soc !== undefined ? d.soc + '%' : '—'}</div>
              <span class="flow-pill ${flowCls}">${flowText}</span>
            </div>
            <div class="soc-right">
              <div class="soc-cap">${fmt(d.remCap, 1)} / ${fmt(d.nomCap, 0)} Ah</div>
              <div class="soc-eta">${etaStr}</div>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill ${socClass}" style="width:${Math.min(100, Math.max(0, soc))}%"></div>
          </div>
        </div>

        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-label">Напруга</div>
            <div class="metric-num">${fmt(d.voltage, 2)} <span class="unit">V</span></div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Струм</div>
            <div class="metric-num">${fmt(d.current, 2)} <span class="unit">A</span></div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Потужність</div>
            <div class="metric-num">${fmt(d.power, 0)} <span class="unit">W</span></div>
          </div>
        </div>

        <div class="switches-grid">
          <div class="switch-pill ${balActive ? 'bal-on' : ''}">
            <span>⚖️ Баланс</span>
            <span class="state">${balActive ? 'ON' : 'OFF'}</span>
          </div>
          <div class="switch-pill ${d.chgMos ? 'on' : 'off'}">
            <span>⚡ Заряд</span>
            <span class="state">${d.chgMos === undefined ? '—' : (d.chgMos ? 'ON' : 'OFF')}</span>
          </div>
          <div class="switch-pill ${d.dsgMos ? 'on' : 'off'}">
            <span>🔋 Розряд</span>
            <span class="state">${d.dsgMos === undefined ? '—' : (d.dsgMos ? 'ON' : 'OFF')}</span>
          </div>
        </div>

        ${cells.length > 0 ? `
          <div class="cells-panel">
            <div class="cells-header">
              <span class="cells-title">Комірки (${cells.length}S) • ${minV.toFixed(3)}–${maxV.toFixed(3)}V</span>
              <span class="delta-badge ${deltaClass}">Δ ${deltaMv} mV</span>
            </div>
            <div class="cells-grid">
              ${cellsHtml}
            </div>
          </div>
        ` : ''}

        <div class="card-footer">
          <span class="footer-chip">🔄 Цикли: <b>${d.cycles !== undefined ? d.cycles : '—'}</b></span>
          <span class="footer-chip">🌡 Темп: <b>${tempStr}</b></span>
          ${d.soh ? `<span class="footer-chip">💚 SOH: <b>${d.soh}%</b></span>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

renderCards();
</script>
</body>
</html>
